name: CI

permissions:
  contents: read

env:
  HELM_VERSION: v3.21.0
  KIND_VERSION: v0.32.0
  KUBECTL_VERSION: v1.34.8
  POSTGRES_IMAGE: postgres:17.10-alpine3.23

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x ./mvnw

      # Testcontainers démarre PostgreSQL via Docker — pas de service GitHub Actions.
      # Le comportement est identique aux tests locaux (@Testcontainers + PostgreSQLContainer).
      #
      # Important :
      # Ne pas définir SUBNETORY_ADMIN_DEFAULT_PASSWORD ici.
      # Les tests utilisent le profil test et attendent admin / admin.
      #
      # verify (au lieu de test) : déclenche la phase verify de Maven,
      # ce qui exécute les tests ET génère le rapport JaCoCo (goal report lié à verify).
      - name: Run tests and generate JaCoCo report
        working-directory: backend
        run: ./mvnw clean "-Dtest=*Test,*IT" verify -B
        env:
          SUBNETORY_JWT_SECRET: ci-test-secret-minimum-32-characters-here

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  # Garde-fou (audit 04/08/2026, correctif FAIBLE) : v0.8.1/v0.8.2/v0.8.3 ont
  # chacune laisse backend/pom.xml a la version exacte du tag deja publie
  # apres que main a continue d'avancer, sans jamais rebasculer vers la
  # prochaine -SNAPSHOT — un JAR construit depuis main annoncait alors la
  # meme version qu'une release deja publiee, avec un contenu different. Voir
  # scripts/verify-pom-version-freshness.sh. fetch-depth: 0 necessaire pour
  # voir tous les tags (le clone superficiel par defaut ne les recupere pas).
  version-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify pom.xml is not stale relative to an existing tag
        run: bash scripts/verify-pom-version-freshness.sh

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Docker Compose availability
        run: docker compose version

      - name: Run autonomous Compose smoke test
        shell: pwsh
        run: ./scripts/smoke-test-compose.ps1 -RepositoryPath "$env:GITHUB_WORKSPACE" -RedactedLogPath "$env:RUNNER_TEMP/subnetory-compose-smoke.redacted.log"

      - name: Upload redacted Compose logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-smoke-redacted-logs
          path: ${{ runner.temp }}/subnetory-compose-smoke.redacted.log
          if-no-files-found: ignore
          retention-days: 7

  compose-https-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Docker Compose availability
        run: docker compose version

      - name: Run HTTPS reverse-proxy overlay smoke test
        shell: pwsh
        run: ./scripts/smoke-test-compose-https.ps1 -RepositoryPath "$env:GITHUB_WORKSPACE" -RedactedLogPath "$env:RUNNER_TEMP/subnetory-compose-https-smoke.redacted.log"

      - name: Upload redacted Compose HTTPS logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-https-smoke-redacted-logs
          path: ${{ runner.temp }}/subnetory-compose-https-smoke.redacted.log
          if-no-files-found: ignore
          retention-days: 7

  backup-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pull pinned PostgreSQL image
        run: docker pull "${POSTGRES_IMAGE}"

      - name: Validate backup integrity and retention
        shell: pwsh
        run: >-
          ./scripts/test-postgres-backup-script.ps1
          -RepositoryPath "$env:GITHUB_WORKSPACE"
          -PostgresImage "$env:POSTGRES_IMAGE"

      - name: Reject hostile restore inputs in an isolated drill
        shell: pwsh
        run: >-
          ./scripts/test-postgres-restore-drill.ps1
          -RepositoryPath "$env:GITHUB_WORKSPACE"
          -PostgresImage "$env:POSTGRES_IMAGE"

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # aquasecurity/trivy-action a subi une compromission de supply-chain
      # critique (GHSA-69fq-xp46-6x23 / CVE-2026-33634, mars 2026) : 76 des 77
      # tags historiques du depot avaient ete force-pousses vers des commits
      # malveillants. Epinglage strict sur le commit SHA de la release
      # immutable et signee v0.36.0 (posterieure a l'incident) — voir
      # backend/docs/README.md, section "Actions GitHub tierces".
      - name: Scan Maven dependencies (source)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          format: table

      - name: Build Docker image for scanning
        run: docker build -t subnetory:dependency-scan backend

      # Scan de l'image construite : paquets OS (eclipse-temurin/alpine) et
      # dependances Maven embarquees dans le JAR Spring Boot executable.
      # Couverture complementaire au scan "fs" ci-dessus, qui ne resout pas
      # toujours l'arbre transitif complet sans artefact construit.
      - name: Scan Docker image (OS packages + embedded JAR)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: subnetory:dependency-scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          format: table

  # SAST (correctif qualite, second audit externe 04/08/2026) : analyse
  # statique du code source Java, complementaire a dependency-scan ci-dessus
  # (qui couvre les vulnerabilites connues des bibliotheques tierces, pas les
  # defauts du code applicatif lui-meme — injection, desserialisation non
  # sure, etc.). CodeQL choisi plutot que SpotBugs/SonarQube : integration
  # native GitHub Actions (Security tab, alertes PR), sans plugin Maven ni
  # service tiers supplementaire a maintenir — coherent avec la preference du
  # projet pour des outils simples pour une petite equipe.
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      # actions: read requis par github/codeql-action/analyze (constat CI
      # 04/08/2026) : sans ce droit, l'etape "Perform CodeQL Analysis"
      # echoue avec "Error: Resource not accessible by integration" en
      # tentant de lire les informations du workflow run en cours.
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          languages: java-kotlin
          queries: security-extended

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x ./mvnw

      # package, pas verify : la compilation suffit a l'analyse CodeQL,
      # inutile de re-executer toute la suite de tests ici (deja couverte
      # par le job test ci-dessus).
      - name: Build backend (compile only)
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Perform CodeQL Analysis
        # continue-on-error : l'analyse elle-meme reussit (voir les logs,
        # ex. "CodeQL scanned 296 out of 297 Java files"), seul l'upload
        # SARIF vers l'onglet Security echoue tant que GitHub Advanced
        # Security n'est pas active sur ce depot prive ("Advanced Security
        # must be enabled for this repository to use code scanning",
        # constat CI 04/08/2026). Non-bloquant pour ne pas faire echouer
        # toute la CI sur un reglage de compte plutot qu'un vrai defaut de
        # code ; a retirer si/quand Advanced Security est active.
        continue-on-error: true
        uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          category: "/language:java-kotlin"

  helm-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Helm
        shell: bash
        run: |
          set -euo pipefail
          archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          mkdir -p "${RUNNER_TEMP}/bin" "${RUNNER_TEMP}/helm"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://get.helm.sh/${archive}"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${archive}.sha256sum" \
            "https://get.helm.sh/${archive}.sha256sum"
          (cd "${RUNNER_TEMP}" && sha256sum --check "${archive}.sha256sum")
          tar --extract --gzip \
            --file "${RUNNER_TEMP}/${archive}" \
            --directory "${RUNNER_TEMP}/helm"
          install -m 0755 \
            "${RUNNER_TEMP}/helm/linux-amd64/helm" \
            "${RUNNER_TEMP}/bin/helm"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Validate chart, schema and rendered secret handling
        shell: bash
        run: |
          set -euo pipefail
          chart="charts/subnetory"
          rendered="${RUNNER_TEMP}/subnetory-rendered.yaml"
          rendered_external="${RUNNER_TEMP}/subnetory-rendered-external.yaml"

          helm lint "${chart}" --strict
          helm template subnetory "${chart}" --namespace subnetory \
            > "${rendered}"

          # Correctif securite MOYENNE (audit 04/08/2026) : le profil de
          # durcissement production (secrets.*KeyEnabled, networkPolicy,
          # voir INSTALL_KUBERNETES.md section 7) doit rester un overlay
          # valide et se combiner sans erreur avec values.yaml.
          helm lint "${chart}" --strict -f "${chart}/values-production.yaml"
          helm template subnetory-production "${chart}" --namespace subnetory \
            -f "${chart}/values-production.yaml" \
            > /dev/null
          helm template subnetory-external "${chart}" \
            --namespace subnetory \
            --set postgresql.enabled=false \
            --set externalDatabase.enabled=true \
            --set externalDatabase.host=postgres.example.internal \
            > "${rendered_external}"

          if helm template invalid "${chart}" \
              --set replicaCount=2 > /dev/null 2>&1; then
            echo "values.schema.json accepted replicaCount > 1" >&2
            exit 1
          fi
          if helm template invalid "${chart}" \
              --set postgresql.enabled=false \
              --set externalDatabase.enabled=false > /dev/null 2>&1; then
            echo "values.schema.json accepted no database mode" >&2
            exit 1
          fi
          if helm template invalid "${chart}" \
              --set postgresql.enabled=true \
              --set externalDatabase.enabled=true \
              --set externalDatabase.host=postgres.example.internal \
              > /dev/null 2>&1; then
            echo "values.schema.json accepted both database modes" >&2
            exit 1
          fi

          # Correctif securite ELEVEE (audit 04/08/2026) : ingress.enabled=true
          # sans ingress.trustedProxyCidrs doit etre refuse au rendu (voir le
          # "fail" dans templates/configmap.yaml), sinon un deploiement Ingress
          # se retrouve silencieusement sans trusted-proxy configure cote
          # application (TrustAwareForwardedHeaderFilter, ClientIpResolver),
          # et tous les utilisateurs partagent la meme IP apparente.
          if helm template invalid "${chart}" \
              --set ingress.enabled=true \
              --set ingress.className=nginx \
              --set ingress.hosts[0].host=subnetory.example.internal \
              --set ingress.hosts[0].paths[0].path=/ \
              --set ingress.hosts[0].paths[0].pathType=Prefix \
              > /dev/null 2>&1; then
            echo "Helm chart rendered an Ingress without ingress.trustedProxyCidrs (forward-headers/trusted-proxy would stay unset)" >&2
            exit 1
          fi

          rendered_ingress="${RUNNER_TEMP}/subnetory-rendered-ingress.yaml"
          helm template subnetory-ingress "${chart}" --namespace subnetory \
            --set ingress.enabled=true \
            --set ingress.className=nginx \
            --set ingress.trustedProxyCidrs='{10.244.0.0/16}' \
            --set ingress.hosts[0].host=subnetory.example.internal \
            --set ingress.hosts[0].paths[0].path=/ \
            --set ingress.hosts[0].paths[0].pathType=Prefix \
            > "${rendered_ingress}"

          # Correctif securite MOYENNE (audit externe 04/08/2026) :
          # SERVER_FORWARD_HEADERS_STRATEGY=framework doit rester absent du
          # rendu — le positionner enregistrerait EN PLUS l'auto-configuration
          # Spring Boot standard de ForwardedHeaderFilter (inconditionnelle,
          # sans verification trusted-proxy-cidrs), en parallele de
          # TrustAwareForwardedHeaderFilter (SecurityConfig) qui remplace
          # entierement ce mecanisme de facon verifiee. Regression gardee ici
          # pour qu'un futur retour de cette variable dans configmap.yaml
          # casse la CI plutot que d'etre decouvert en production.
          # Ancre sur une vraie cle YAML (^\s*NOM:) plutot qu'une simple
          # sous-chaine, ET exclut d'abord les lignes de commentaire
          # (correctif CI 04/08/2026, constat en CI reelle malgre l'ancrage
          # seul) : configmap.yaml explique deliberement en commentaire
          # pourquoi cette variable est absente — le rendu Helm preserve
          # les commentaires tels quels, donc toute variante de detection
          # moins stricte risque un faux positif systematique sur ce
          # commentaire plutot que sur une vraie cle. grep -v filtre les
          # lignes de commentaire avant la recherche, en plus de l'ancrage.
          if grep -v '^[[:space:]]*#' "${rendered_ingress}" \
              | grep -Eq '^[[:space:]]*SERVER_FORWARD_HEADERS_STRATEGY:'; then
            echo "Ingress-enabled render must NOT set SERVER_FORWARD_HEADERS_STRATEGY (see TrustAwareForwardedHeaderFilter)" >&2
            echo "--- matching line(s) in rendered manifest (for debugging) ---" >&2
            grep -n 'SERVER_FORWARD_HEADERS_STRATEGY' "${rendered_ingress}" >&2 || true
            exit 1
          fi
          if ! grep -Fq 'SUBNETORY_SECURITY_TRUSTED_PROXY: "true"' "${rendered_ingress}"; then
            echo "Ingress-enabled render is missing SUBNETORY_SECURITY_TRUSTED_PROXY=true" >&2
            exit 1
          fi
          if ! grep -Fq 'SUBNETORY_SECURITY_TRUSTED_PROXY_CIDRS: "10.244.0.0/16"' "${rendered_ingress}"; then
            echo "Ingress-enabled render is missing SUBNETORY_SECURITY_TRUSTED_PROXY_CIDRS" >&2
            exit 1
          fi

          # Correctif securite MOYENNE (audit externe 04/08/2026) :
          # networkPolicy.ingressFrom, quand renseigne, doit bien restreindre
          # la regle d'entree applicative (sinon un pod compromis ailleurs
          # dans le cluster peut toujours atteindre directement l'app). Par
          # defaut (non renseigne), le rendu reste sans "from" — comportement
          # historique preserve, verifie ici pour la non-regression.
          #
          # Le rendu complet contient AUSSI la NetworkPolicy PostgreSQL
          # (second document YAML, separe par "---"), dont la regle
          # d'entree a volontairement TOUJOURS un "from:" (seuls les pods
          # applicatifs/backup peuvent atteindre postgres — comportement
          # voulu, independant de networkPolicy.ingressFrom). Un grep sur
          # le fichier entier declenche donc un faux positif systematique
          # (constate en CI) : on isole le premier document (NetworkPolicy
          # applicative) avant de chercher "from:".
          rendered_netpol_default="${RUNNER_TEMP}/subnetory-rendered-netpol-default.yaml"
          helm template subnetory-netpol-default "${chart}" --namespace subnetory \
            --set networkPolicy.enabled=true \
            > "${rendered_netpol_default}"
          if awk '/^---$/{exit} {print}' "${rendered_netpol_default}" | grep -Fq 'from:'; then
            echo "Default networkPolicy render (no ingressFrom) unexpectedly restricts ingress — check networkpolicy.yaml" >&2
            exit 1
          fi

          rendered_netpol_restricted="${RUNNER_TEMP}/subnetory-rendered-netpol-restricted.yaml"
          # printf plutot qu'un heredoc : un heredoc dedente son corps a la
          # colonne 0, ce qui casse le parsing YAML de CE fichier de
          # workflow (le corps, moins indente que le bloc "run: |" qui le
          # contient, met fin prematurement au bloc scalaire) — invalide
          # constate en CI (echec "Invalid workflow file", erreur de syntaxe
          # YAML sur la ligne du heredoc), pas seulement theorique.
          printf '%s\n' \
            'networkPolicy:' \
            '  enabled: true' \
            '  ingressFrom:' \
            '    - namespaceSelector:' \
            '        matchLabels:' \
            '          kubernetes.io/metadata.name: ingress-nginx' \
            > "${RUNNER_TEMP}/netpol-ingress-from.yaml"
          helm template subnetory-netpol-restricted "${chart}" --namespace subnetory \
            -f "${RUNNER_TEMP}/netpol-ingress-from.yaml" \
            > "${rendered_netpol_restricted}"
          if ! grep -Fq 'kubernetes.io/metadata.name: ingress-nginx' "${rendered_netpol_restricted}"; then
            echo "networkPolicy.ingressFrom did not render into the application NetworkPolicy" >&2
            exit 1
          fi

          if grep -Eq \
              '^(kind: Secret|[[:space:]]*- name: (SUBNETORY_JWT_SECRET|SUBNETORY_ADMIN_DEFAULT_PASSWORD|SPRING_DATASOURCE_PASSWORD|POSTGRES_PASSWORD)[[:space:]]*$)' \
              "${rendered}" "${rendered_external}"; then
            echo "Rendered manifests expose a clear-text secret resource or variable" >&2
            exit 1
          fi

      - name: Validate scheduled backup safety invariants
        shell: pwsh
        run: >-
          ./scripts/test-helm-backup-static.ps1
          -RepositoryPath "$env:GITHUB_WORKSPACE"
          -HelmPath helm

  helm-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Helm, kind and kubectl
        shell: bash
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}" "${RUNNER_TEMP}/helm"

          archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://get.helm.sh/${archive}"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${archive}.sha256sum" \
            "https://get.helm.sh/${archive}.sha256sum"
          (cd "${RUNNER_TEMP}" && sha256sum --check "${archive}.sha256sum")
          tar --extract --gzip \
            --file "${RUNNER_TEMP}/${archive}" \
            --directory "${RUNNER_TEMP}/helm"
          install -m 0755 "${RUNNER_TEMP}/helm/linux-amd64/helm" "${bin}/helm"

          curl --fail --location --silent --show-error \
            --output "${bin}/kind" \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/kind.sha256sum" \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          kind_checksum="$(awk '{print $1}' "${RUNNER_TEMP}/kind.sha256sum")"
          echo "${kind_checksum}  ${bin}/kind" \
            | sha256sum --check
          chmod 0755 "${bin}/kind"

          curl --fail --location --silent --show-error \
            --output "${bin}/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/kubectl.sha256" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat "${RUNNER_TEMP}/kubectl.sha256")  ${bin}/kubectl" \
            | sha256sum --check
          chmod 0755 "${bin}/kubectl"

          echo "${bin}" >> "${GITHUB_PATH}"

      - name: Validate Docker availability
        run: docker version

      - name: Run both Helm deployment profiles on kind
        shell: pwsh
        run: >-
          ./scripts/smoke-test-helm.ps1
          -RepositoryPath "$env:GITHUB_WORKSPACE"
          -KindPath kind
          -KubectlPath kubectl
          -HelmPath helm
          -Profile All
          -RedactedLogPath "$env:RUNNER_TEMP/subnetory-helm-smoke.redacted.log"

      - name: Upload redacted Helm logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-smoke-redacted-logs
          path: ${{ runner.temp }}/subnetory-helm-smoke.redacted.log
          if-no-files-found: ignore
          retention-days: 7
