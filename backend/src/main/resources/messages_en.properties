# --- Admin help: audit.html ---
helpAdmin.audit.subtitle=Who did what and when: logins, backups, creation/deletion of network resources.
helpAdmin.audit.access.title=Access
helpAdmin.audit.access.body=Menu <em>Administration → Audit</em> (<code>/admin/audit-log</code>), restricted to <code>ROLE_ADMIN</code>.
helpAdmin.audit.events.title=Tracked events
helpAdmin.audit.events.authTitle=Authentication and accounts
helpAdmin.audit.events.authCodes=<code>LOGIN_SUCCESS</code>, <code>LOGIN_FAILURE</code>, <code>LOGIN_LOCKED</code>, <code>PASSWORD_CHANGE</code>, <code>ADMIN_PASSWORD_RESET</code>, <code>TOKEN_REVOKED</code>, <code>TOKENS_INVALIDATED</code>, <code>CONTEXT_ACCESS_DENIED</code>, <code>USER_CREATED</code>, <code>USER_CONTEXTS_UPDATED</code>, <code>MFA_ENABLED</code>, <code>MFA_DISABLED</code>, <code>MFA_RECOVERY_CODES_REGENERATED</code>, <code>MFA_CHALLENGE_FAILED</code>, <code>MFA_DISABLED_BY_ADMIN</code>.
helpAdmin.audit.events.backupTitle=Backups
helpAdmin.audit.events.backupCodes=<code>BACKUP_TRIGGERED</code>, <code>BACKUP_IMPORTED</code>, <code>BACKUP_RESTORED</code>, <code>BACKUP_DELETED</code>, <code>BACKUP_PURGED</code>, <code>BACKUP_SETTINGS_UPDATED</code> — all state-changing actions in <code>/admin/backup</code>.
helpAdmin.audit.events.networkTitle=Network resources
helpAdmin.audit.events.networkCodes=<code>ADDRESS_CREATED</code>/<code>_DELETED</code>, <code>VLAN_CREATED</code>/<code>_DELETED</code>, <code>CONTEXT_CREATED</code>/<code>_DELETED</code>, <code>SITE_CREATED</code>/<code>_DELETED</code>, <code>SUBNET_CREATED</code>/<code>_DELETED</code>.
helpAdmin.audit.filters.title=Filters and pagination
helpAdmin.audit.filters.body=Two criteria: user search (on username and target user) and event type — if a type is selected, it takes priority over the text search. The most recent events are shown first, 50 entries per page.
helpAdmin.audit.export.title=CSV export
helpAdmin.audit.export.body=<code>/admin/audit-log/export.csv</code>, respects the active filters. Exported columns: date, event type, user, target user, IP, success, message, user-agent. The export is protected against CSV injection (values starting with <code>=</code>, <code>+</code>, <code>-</code>, <code>@</code> are prefixed with an apostrophe).
helpAdmin.audit.export.warning=Do not expose CSV exports to non-administrator users.
helpAdmin.audit.retention.title=Retention and purge
helpAdmin.audit.retention.body=An automatic purge scheduled every night deletes entries older than the configured retention period (90 days by default).
helpAdmin.table.property=Property
helpAdmin.table.envVar=Environment variable
helpAdmin.table.default=Default
helpAdmin.audit.retention.manualPurgeIntro=An immediate manual purge before a given date remains possible from <code>/admin/audit-log</code> ("Purge permanently" button) or via the API:
helpAdmin.audit.retention.commandLabel=Manual purge
helpAdmin.audit.bestPractices.title=Best practices
helpAdmin.audit.bestPractices.item1=Keep retention active in production, increase it if audit needs require it.
helpAdmin.audit.bestPractices.item2=Export logs before a manual purge or a sensitive operation.
helpAdmin.audit.bestPractices.item3=Monitor the size of the <code>auth_audit_log</code> table if the application is heavily used.

# --- Admin help: sauvegardes.html ---
helpAdmin.backup.subtitle=Two independent mechanisms exist — do not enable both on the same database.
helpAdmin.backup.engine.title=Built-in engine (recommended)
helpAdmin.backup.engine.body1=<code>pg_dump</code>/<code>pg_restore</code> run by the application itself, identical in Docker Compose and Kubernetes. Interface: <code>/admin/backup</code>. Full REST API, full parity with the interface, prefix <code>/api/v1/admin/backup</code>, restricted to <code>ROLE_ADMIN</code> or <code>ROLE_BACKUP</code> (Bearer token required).
helpAdmin.backup.engine.body2=Any backup or restore left "Running" following an abrupt stop (rebuild, crash) is automatically marked as failed on the next startup — no row remains stuck indefinitely.
helpAdmin.backup.engine.actionsTitle=Actions available from /admin/backup
helpAdmin.backup.engine.action1=Automatic scheduling via a visual cron builder (daily, weekly, monthly, interval or custom expression).
helpAdmin.backup.engine.action2=Immediate manual trigger, with optional title/comment.
helpAdmin.backup.engine.action3=Download of a backup file, with verifiable SHA-256 checksum.
helpAdmin.backup.engine.action4=Import of an external <code>.dump</code> file (verified via <code>pg_restore --list</code> before acceptance), then restorable like any other backup.
helpAdmin.backup.engine.action5=Restore with confirmation by typing the exact file name — never in one click — and an automatic safety backup just before.
helpAdmin.backup.engine.action6=Fine-grained deletion of a backup, or cascade deletion with its linked restores.
helpAdmin.backup.engine.action7=Manual purge of the history before a given date.
helpAdmin.backup.encryption.title=Encryption at rest (optional)
helpAdmin.backup.encryption.body1=Enabled by default for any new Docker Compose install. AES-256-GCM + HMAC-SHA256, key derived via PBKDF2 from a passphrase provided exclusively through the <code>SUBNETORY_BACKUP_ENCRYPTION_KEY</code> variable — never stored in the database, never editable from the interface.
helpAdmin.backup.encryption.body2=Once configured, any new backup (scheduled, manual, or pre-restore safety) is automatically encrypted ("Encrypted" badge in the history, <code>encrypted</code> field in the API). Existing unencrypted backups remain usable normally — encryption never applies retroactively.
helpAdmin.backup.encryption.warning=<strong>This is not a key rotation.</strong> Changing or losing the key value permanently makes unreadable all backups already encrypted with the old value. Keep the passphrase outside the application (the team's secrets manager), just like the PostgreSQL password, and never change it once encrypted backups have been produced.
helpAdmin.backup.encryption.docs=Secret generation and protection (restrictive Windows/Linux permissions), and the procedure for a new instance that must remain able to read backups encrypted by another instance: see <code>backend/docs/BACKUP_ENCRYPTION.md</code> and <code>backend/docs/INSTALL_DOCKER_COMPOSE.md</code>.
helpAdmin.backup.api.title=API commands
helpAdmin.backup.api.currentConfig=Current configuration and status
helpAdmin.backup.api.trigger=Trigger an immediate backup
helpAdmin.backup.api.restore=Restore (confirmation by exact file name)
helpAdmin.backup.api.purge=Purge history before a date
helpAdmin.backup.api.docsLink=Full endpoint reference (request/response schemas): Swagger UI <code>/swagger-ui.html</code>. See also
helpAdmin.backup.api.docsLinkText=the API guide
helpAdmin.backup.scripts.title=Legacy PowerShell scripts (alternative mechanism)
helpAdmin.backup.scripts.body=Independent of the application, useful as a fallback if it is unavailable. Windows + Docker Desktop only.
helpAdmin.table.script=Script
helpAdmin.table.role=Role
helpAdmin.backup.scripts.backup.role=Backup + rotation (hourly/daily/monthly/quarterly)
helpAdmin.backup.scripts.restore.role=Restore of a <code>.sql.gz</code> file
helpAdmin.backup.scripts.check.role=Status check (age, size, GZip integrity, SHA-256 hash)
helpAdmin.backup.scripts.dailyLabel=Daily backup
helpAdmin.backup.scripts.restoreLabel=Restore with automatic safety backup
helpAdmin.backup.scripts.docs=Full details (parameters, automation via Windows Task Scheduler, step-by-step emergency restore procedure): <code>backend/docs/BACKUP_STRATEGY.md</code>, <code>backend/docs/RESTORE_OPERATIONS.md</code>, <code>backend/docs/BACKUP_SCHEDULING_WINDOWS.md</code>.
helpAdmin.backup.rules.title=Security rules for any restore
helpAdmin.backup.rules.item1=Never restore without having checked the full path and date of the file.
helpAdmin.backup.rules.item2=Never run a production restore without a prior safety backup and an identified intervention window.
helpAdmin.backup.rules.item3=After a restore: check the application startup, authentication, data consistency and the absence of errors in the logs.
helpAdmin.backup.rules.item4=Document every restore (date, environment, file used, result) in an intervention report.

# --- Admin help: deploiement-docker.html ---
helpAdmin.docker.subtitle=Standalone installation with PostgreSQL included, file-based secrets, and optional HTTPS exposure.
helpAdmin.docker.secrets.title=Generate the secrets
helpAdmin.docker.secrets.body1=Three secrets are required before the first startup: the JWT secret, the temporary administrator password and the PostgreSQL password. A dedicated script generates them randomly without ever displaying their value, and applies restrictive permissions (<code>icacls</code> on Windows, <code>chmod 600</code> on Linux/macOS).
helpAdmin.docker.secrets.powershellLabel=PowerShell
helpAdmin.docker.secrets.bashLabel=Bash
helpAdmin.docker.secrets.body2=A fourth secret, <code>subnetory_backup_encryption_key</code>, enables backup encryption (enabled by default, generated automatically):
helpAdmin.docker.secrets.withoutEncryptionLabel=Without backup encryption
helpAdmin.docker.secrets.warning=The script refuses to overwrite an existing secret. The <code>-Force</code>/<code>--force</code> option is reserved for a deliberate and coordinated rotation — never a generic repair command.
helpAdmin.docker.start.title=Start the stack
helpAdmin.docker.start.fromBackendLabel=From backend/
helpAdmin.docker.start.body=Flyway migrations apply automatically on startup. PostgreSQL remains strictly internal to the Compose network, never published on a host port.
helpAdmin.docker.secretsProtection.title=Protecting secrets on the machine
helpAdmin.docker.secretsProtection.body=The script's restrictive permissions block access from another unprivileged account on the same machine — they do not protect against an attacker who obtains your own account's rights or administrator rights, nor against theft of a powered-off disk without volume encryption (BitLocker/LUKS).
helpAdmin.docker.secretsProtection.warning=Particular attention point if the repository folder is synced by a cloud client (OneDrive Known Folder Move in particular): the <code>secrets/</code> folder, although git-ignored, would then be synced to the cloud unencrypted. Verify that no cloud sync covers this folder.
helpAdmin.docker.https.title=Turnkey HTTPS (Caddy overlay, optional)
helpAdmin.docker.https.body1=<code>docker-compose.https.yml</code> adds a Caddy reverse proxy in front of the application, with no external infrastructure to manage (no certificate to generate or install manually).
helpAdmin.table.mode=Mode
helpAdmin.table.usage=Usage
helpAdmin.table.certificate=Certificate
helpAdmin.docker.https.mode.internal=Internal
helpAdmin.docker.https.mode.internal.usage=Corporate network, no public domain
helpAdmin.docker.https.mode.internal.cert=Self-signed (normal browser warning)
helpAdmin.docker.https.mode.public=Public
helpAdmin.docker.https.mode.public.usage=Domain resolved to this host, ports 80/443 accessible from the Internet
helpAdmin.docker.https.mode.public.cert=Automatic Let's Encrypt, renewed without intervention
helpAdmin.docker.https.copyCaddyfileLabel=Internal mode — copy the Caddyfile
helpAdmin.docker.https.startOverlayLabel=Start with the overlay
helpAdmin.docker.https.body2=The overlay automatically enables trust in the internal proxy (<code>SUBNETORY_SECURITY_TRUSTED_PROXY</code>) so that per-IP rate limiting and authentication auditing remain accurate — without this, all requests would be counted as coming from a single IP (the Caddy container).
helpAdmin.docker.https.warning=The <code>caddy_data</code> volume keeps certificates between restarts — do not delete it without reason in public mode (new Let's Encrypt requests, risk of rate limiting on repeated deletions).
helpAdmin.docker.docs.title=Related documents
helpAdmin.docker.docs.body=<code>backend/docs/INSTALL_DOCKER_COMPOSE.md</code>, <code>backend/docs/HTTPS_REVERSE_PROXY.md</code>, <code>backend/docs/DOCKER_COMPOSE_OPERATIONS.md</code>.

# --- Admin help: deploiement-kubernetes.html ---
helpAdmin.k8s.subtitle=Single-replica Helm chart, with included or external PostgreSQL.
helpAdmin.k8s.scope.title=Scope
helpAdmin.k8s.scope.body=The <code>charts/subnetory</code> chart enforces <code>replicaCount: 1</code>. It provides neither application high availability, nor a PostgreSQL operator, nor an official public image — the image must be built and made accessible to the cluster nodes.
helpAdmin.k8s.image.title=Providing the image
helpAdmin.k8s.image.kindLabel=kind cluster (local build)
helpAdmin.k8s.image.body=For another cluster: build the image, publish it to the authorized private registry, then provide <code>image.repository</code>/<code>image.tag</code> and <code>image.imagePullSecrets</code> in the values. Never use a floating tag like <code>latest</code>.
helpAdmin.k8s.secrets.title=Kubernetes Secrets
helpAdmin.k8s.secrets.body1=As with Docker Compose, a dedicated script creates the Secrets without ever displaying their value, and refuses to overwrite an existing Secret:
helpAdmin.k8s.secrets.powershellLabel=PowerShell
helpAdmin.k8s.secrets.body2=Two objects are created: <code>subnetory-runtime-secrets</code> (JWT secret, PostgreSQL password) and <code>subnetory-bootstrap-secrets</code> (temporary administrator password). The chart does not generate any Secret and does not accept any plaintext secret value in <code>values.yaml</code>.
helpAdmin.k8s.installIncluded.title=Installing with included PostgreSQL
helpAdmin.k8s.installIncluded.commandLabel=Validate then install
helpAdmin.k8s.installIncluded.body=Creates an application Deployment (<code>Recreate</code> strategy), a <code>ClusterIP</code> Service, a PostgreSQL StatefulSet, and an 8 Gi PostgreSQL PVC by default (adjustable via <code>postgresql.persistence</code>).
helpAdmin.k8s.installExternal.title=Installing with external PostgreSQL
helpAdmin.k8s.installExternal.body=The external role and database must already exist. The <code>postgres-password</code> value of the runtime Secret must exactly match the password of the configured external role.
helpAdmin.k8s.installExternal.valuesLabel=non-sensitive values
helpAdmin.k8s.scheduledBackups.title=Scheduled backups (optional)
helpAdmin.k8s.scheduledBackups.body=Disabled by default, reserved for the included PostgreSQL (the chart refuses to enable them with an external database). Tiered CronJobs (hourly/daily/monthly/quarterly), each with its own retention. A NetworkPolicy dedicated to backup pods denies ingress and limits egress to the included PostgreSQL and the cluster DNS.
helpAdmin.k8s.scheduledBackups.warning=Combining these scheduled backups (<code>backup.enabled</code>) with the built-in application engine (<code>backupApp.enabled</code>) on the same database is explicitly rejected by the chart at render time (<code>helm template</code> fails deliberately).
helpAdmin.k8s.scheduledBackups.validate=Always validate the render before enabling: <code>helm lint .\charts\subnetory --strict</code>.
helpAdmin.k8s.docs.title=Related documents
helpAdmin.k8s.docs.body=<code>backend/docs/INSTALL_KUBERNETES.md</code> (full procedure, including rotation and troubleshooting), <code>backend/docs/KUBERNETES_OPERATIONS.md</code>, <code>backend/docs/KUBERNETES_COMPATIBILITY.md</code>.

