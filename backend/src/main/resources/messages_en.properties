# --- Admin help: utilisateurs-roles.html ---
helpAdmin.usersRoles.subtitle=Account management, available roles, token revocation and emergency recovery.
helpAdmin.usersRoles.roles.title=Available roles
helpAdmin.roles.table.role=Role
helpAdmin.roles.table.rights=Rights
helpAdmin.roles.admin.desc=Full access, user and administration management
helpAdmin.roles.readonly.desc=View data for authorized contexts
helpAdmin.roles.network.desc=Create and edit contexts, sites, VLANs, subnets and scans
helpAdmin.roles.ip.desc=Create, edit, delete, import and export IP addresses
helpAdmin.roles.backup.desc=Limited access to <code>/admin/backup</code> (configuration, triggering, import, restore, history) — without the rest of the administration
helpAdmin.usersRoles.rolesCombo=Roles can be combined: a user with <code>ROLE_NETWORK</code> + <code>ROLE_IP</code> manages network operations and IP addresses without access to the application's administration. For a read-only automation account, assign <code>ROLE_READ_ONLY</code> and limit its scope to the necessary contexts. <code>ROLE_BACKUP</code> suits a service account or an operator dedicated to backups.
helpAdmin.usersRoles.accounts.title=Account management
helpAdmin.usersRoles.accounts.body=Menu <em>Administration → Accounts</em> (<code>/admin/users</code>). Each local account is created with a temporary password; the user is required to change it on first login (<code>mustChangePassword</code>) before being able to use the application or obtain an API token. An administrator can reset a local account's password from the user detail screen — this also re-enables the mandatory change requirement.
helpAdmin.usersRoles.accounts.disableVsDelete=From the same page, an account can be <strong>disabled</strong> (reversible: access is blocked but the account and its history remain viewable) or <strong>permanently deleted</strong> (the "Danger zone" section, irreversible). Deletion is refused for one's own account and for the last active <code>ROLE_ADMIN</code> account. Deleting an account does not affect the audit log or backup history: prefer disabling if the account's page needs to stay reachable.
helpAdmin.usersRoles.tokens.title=API token revocation
helpAdmin.usersRoles.tokens.body=From a user's detail screen, the <strong>Invalidate tokens</strong> action globally invalidates all API JWT tokens already issued for this account — new tokens issued after the action remain valid. This mechanism is also triggered automatically on a password change or an administrative reset, to prevent an old token from remaining usable after a sensitive change.
helpAdmin.usersRoles.tokens.alert=This invalidation only concerns API JWT tokens. It does not log out already open web sessions.
helpAdmin.usersRoles.mfa.title=Two-factor authentication (MFA) — administrator view
helpAdmin.usersRoles.mfa.prefix=Each local account can enable MFA from its own profile (see
helpAdmin.usersRoles.mfa.linkText=the user guide
helpAdmin.usersRoles.mfa.suffix=). LDAP accounts are not affected.
helpAdmin.usersRoles.mfaRecovery.title=Recovery when both password AND MFA are lost
helpAdmin.usersRoles.mfaRecovery.body1=If an account loses access to its password and its authenticator app (and the recovery codes were not kept), no self-service recovery is possible: Subnetory does not send emails and does not offer a password reset link by email.
helpAdmin.usersRoles.mfaRecovery.body2=If another <code>ROLE_ADMIN</code> account exists, this is the normal recovery path, entirely from the UI: from <code>/admin/users</code>, open the blocked account's detail page and reset its password. This does not disable MFA.
helpAdmin.usersRoles.mfaRecovery.body3=On that same detail page (<code>/admin/users/{id}</code>), MFA section, the <strong>"Disable MFA"</strong> button removes the second factor from the account without touching the password — an anti-lockout action built exactly for this case. Resetting the password and then disabling MFA is therefore enough to fully unblock the account, with no database intervention required.
helpAdmin.usersRoles.mfaRecovery.warning=<strong>Only if no other admin account exists</strong>, the recourse becomes direct access to the PostgreSQL database — an emergency procedure to be used only as a last resort, by a trusted person with server access. Full details (SQL queries, bcrypt hash generation) in <code>backend/docs/ADMIN_GUIDE.md</code>, section "Two-factor authentication (MFA)".
helpAdmin.usersRoles.mfaRecovery.bestPractice=Best practice: keep at least two active <code>ROLE_ADMIN</code> accounts, to never depend on a single account.
helpAdmin.usersRoles.ldap.body=Menu <em>Administration → LDAP</em> (<code>/admin/ldap</code>): directory configuration, user search filter, default roles assigned on auto-provisioning, and connection diagnostics.

