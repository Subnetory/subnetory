apiVersion: v1
kind: Pod
metadata:
  name: {{ include "subnetory.fullname" . }}-test-connection
  labels:
    {{- include "subnetory.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: readiness
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - sh
        - -ec
      args:
        - >-
          wget -qO- http://{{ include "subnetory.fullname" . }}:{{ .Values.service.port }}/actuator/health/readiness
          | grep -q '"status":"UP"'
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
      volumeMounts:
        - name: temporary-directory
          mountPath: /tmp
  volumes:
    - name: temporary-directory
      emptyDir:
        sizeLimit: {{ .Values.temporaryDirectory.sizeLimit }}
