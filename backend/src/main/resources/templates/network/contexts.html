<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: layout(~{::#main-content})}">
<head><title>Contextes — Subnetory</title></head>
<body>
<div id="main-content">
<div class="sn-page">

    <div class="sn-page__header">
        <div>
            <h1 class="sn-page__title">Contextes</h1>
            <p class="sn-page__subtitle">Isolez les sites, VLAN et sous-réseaux de chaque client ou environnement.</p>
        </div>
        <div th:if="${canManage}">
            <a href="/network/contexts/new" class="sn-btn sn-btn--primary">+ Nouveau contexte</a>
        </div>
    </div>

    <div th:if="${flashSuccess}" class="sn-alert sn-alert--success" th:text="${flashSuccess}"></div>
    <div th:if="${flashError}"   class="sn-alert sn-alert--error"   th:text="${flashError}"></div>

    <div class="sn-card">
        <div class="sn-table-wrapper">
            <table class="sn-table">
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Description</th>
                        <th>Créé le</th>
                        <th th:if="${canManage}" class="sn-table-col-actions">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ctx : ${contexts}" class="clickable"
                        th:attr="data-href=@{/network/sites(contextId=${ctx.id})}">
                        <td><strong th:text="${ctx.name}">Default</strong></td>
                        <td class="sn-text-secondary" th:text="${ctx.description ?: '—'}">—</td>
                        <td class="sn-text-muted"
                            th:text="${#temporals.format(ctx.createdAt, 'dd/MM/yyyy')}">01/01/2026</td>
                        <td th:if="${canManage}" class="sn-table-actions">
                            <a th:href="@{/network/contexts/{id}/edit(id=${ctx.id})}"
                               class="sn-btn sn-btn--secondary sn-btn--sm">Modifier</a>
                            <form th:action="@{/network/contexts/{id}/delete(id=${ctx.id})}"
                                  method="post"
                                  class="sn-inline-form"
                                  th:attr="data-confirm=|Supprimer le contexte « ${ctx.name} » ?|"
                                  sec:authorize="hasRole('ADMIN')">
                                <button type="submit" class="sn-btn sn-btn--danger sn-btn--sm">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${contexts.empty}" class="sn-table--empty">
                        <td th:colspan="${canManage ? 4 : 3}">Aucun contexte enregistré.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="sn-pagination" th:if="${!contexts.empty}">
            <span class="sn-pagination__info"
                  th:text="${contexts.totalElements} + ' contexte(s)'">N contextes</span>
            <nav class="sn-pagination__nav" th:if="${contexts.totalPages > 1}">
                <a th:href="@{/network/contexts(page=${contexts.number - 1})}"
                   th:classappend="${contexts.first ? 'sn-pagination__btn--disabled' : ''}"
                   class="sn-pagination__btn">‹</a>
                <th:block th:each="i : ${#numbers.sequence(0, contexts.totalPages - 1)}">
                    <a th:href="@{/network/contexts(page=${i})}"
                       th:text="${i + 1}"
                       th:classappend="${i == contexts.number ? 'active' : ''}"
                       class="sn-pagination__btn">1</a>
                </th:block>
                <a th:href="@{/network/contexts(page=${contexts.number + 1})}"
                   th:classappend="${contexts.last ? 'sn-pagination__btn--disabled' : ''}"
                   class="sn-pagination__btn">›</a>
            </nav>
        </div>
    </div>

</div>
</div>
</body>
</html>
