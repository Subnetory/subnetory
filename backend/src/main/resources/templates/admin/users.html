<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::#main-content})}">
<body>
<div id="main-content">
<div class="sn-page">

    <div class="sn-page__header">
        <div>
            <h1 class="sn-page__title" th:text="#{admin.users.heading}">Utilisateurs</h1>
            <p class="sn-page__subtitle" th:text="#{admin.users.subtitle}">Créez des comptes, attribuez des rôles et gérez les accès à Subnetory.</p>
        </div>
        <div class="sn-page__actions">
            <nav class="sn-admin-subnav" th:aria-label="#{profile.nav.aria}">
                <a th:href="@{/admin/users}" class="sn-admin-subnav__item active" th:text="#{admin.subnav.accounts}">Comptes</a>
                <a th:href="@{/admin/ldap}" class="sn-admin-subnav__item" th:text="#{admin.subnav.ldap}">LDAP</a>
                <a th:href="@{/admin/audit-log}" class="sn-admin-subnav__item" th:text="#{admin.subnav.audit}">Audit</a>
                <a th:href="@{/admin/backup}" class="sn-admin-subnav__item" th:text="#{admin.subnav.backup}">Sauvegardes</a>
                <a th:href="@{/admin/help}" class="sn-admin-subnav__item" th:text="#{admin.subnav.help}">Aide</a>
            </nav>
            <a th:href="@{/admin/users/new}" class="sn-btn sn-btn--primary" th:text="#{admin.users.new}">+ Nouvel utilisateur</a>
        </div>
    </div>

    <div th:if="${flashSuccess}" class="sn-alert sn-alert--success" th:text="${flashSuccess}"></div>
    <div th:if="${flashError}"   class="sn-alert sn-alert--error"   th:text="${flashError}"></div>

    <div class="sn-card">
        <div class="sn-table-wrapper">
            <table class="sn-table">
                <thead>
                    <tr>
                        <th th:text="#{profile.account.username}">Identifiant</th>
                        <th th:text="#{admin.users.table.type}">Type</th>
                        <th th:text="#{admin.users.table.roles}">Rôles</th>
                        <th th:text="#{profile.account.status}">Statut</th>
                        <th th:text="#{table.created}">Créé le</th>
                        <th class="sn-table-col-actions" th:text="#{common.actions}">Actions</th>
                    </tr>
                </thead>
                <tbody th:with="lblLocal=#{profile.account.type.local},lblActive=#{profile.account.status.active},lblInactive=#{profile.account.status.inactive}">
                    <tr th:each="user : ${users}">
                        <td><strong th:text="${user.username}">admin</strong></td>
                        <td>
                            <span th:text="${user.authType == 'LDAP' ? 'LDAP' : lblLocal}"
                                  th:classappend="${user.authType == 'LDAP' ? 'sn-badge sn-badge--blue' : 'sn-badge sn-badge--neutral'}">Local</span>
                        </td>
                        <td>
                            <th:block th:each="role : ${user.roles}">
                                <span class="sn-badge sn-badge--neutral"
                                      th:text="${#strings.replace(role.name, 'ROLE_', '')}">IP</span>
                            </th:block>
                        </td>
                        <td>
                            <span th:if="${user.enabled}"     class="sn-badge sn-badge--green" th:text="${lblActive}">Actif</span>
                            <span th:unless="${user.enabled}" class="sn-badge sn-badge--neutral" th:text="${lblInactive}">Inactif</span>
                        </td>
                        <td class="sn-text-muted"
                            th:text="${#temporals.format(user.createdAt.toLocalDate())}">01/01/2026</td>
                        <td class="sn-table-actions">
                            <a th:href="@{/admin/users/{id}(id=${user.id})}"
                               class="sn-btn sn-btn--secondary sn-btn--sm" th:text="#{admin.users.table.detail}">Détail</a>
                        </td>
                    </tr>
                    <tr th:if="${users.empty}" class="sn-table--empty">
                        <td colspan="6" th:text="#{admin.users.empty}">Aucun utilisateur enregistré.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="sn-pagination" th:if="${!users.empty}">
            <span class="sn-pagination__info" th:with="suffix=#{admin.users.pagination.suffix}"
                  th:text="${users.totalElements} + ' ' + suffix">N utilisateurs</span>
            <nav class="sn-pagination__nav" th:if="${users.totalPages > 1}">
                <a th:href="@{/admin/users(page=${users.number - 1})}"
                   th:classappend="${users.first ? 'sn-pagination__btn--disabled' : ''}"
                   class="sn-pagination__btn">‹</a>
                <th:block th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}">
                    <a th:href="@{/admin/users(page=${i})}"
                       th:text="${i + 1}"
                       th:classappend="${i == users.number ? 'active' : ''}"
                       class="sn-pagination__btn">1</a>
                </th:block>
                <a th:href="@{/admin/users(page=${users.number + 1})}"
                   th:classappend="${users.last ? 'sn-pagination__btn--disabled' : ''}"
                   class="sn-pagination__btn">›</a>
            </nav>
        </div>
    </div>

</div>
</div>
</body>
</html>
