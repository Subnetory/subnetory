<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::#main-content})}">
<body>
<div id="main-content">
<div class="sn-page">

    <div class="sn-page__header">
        <div>
            <h1 class="sn-page__title" th:text="${pageTitle}">Adresse IP</h1>
            <p class="sn-page__subtitle" th:text="#{address.form.subtitle}">Renseignez l'adresse, son sous-réseau et ses informations d'identification.</p>
        </div>
    </div>

    <div th:if="${formError}" class="sn-alert sn-alert--error" th:text="${formError}"></div>

    <div class="sn-card sn-card--padded sn-form-card">
        <div class="sn-card__header">
            <h2 class="sn-card__title" th:text="${pageTitle}">Adresse IP</h2>
        </div>

        <form th:action="${formAction}" th:object="${form}" method="post" novalidate class="sn-form">

            <input type="hidden" th:field="*{id}" />

            <div class="sn-form__group" th:classappend="${#fields.hasErrors('address')} ? ' sn-form__group--error'">
                <label for="address" class="sn-form__label">
                    <span th:text="#{address.form.ip.label}">Adresse IP</span> <span class="sn-form-required">*</span>
                </label>
                <input type="text"
                       id="address"
                       th:field="*{address}"
                       class="sn-input sn-text-mono"
                       th:placeholder="#{address.form.ip.placeholder}"
                       autocomplete="off"
                       maxlength="45"
                       required
                       aria-required="true" />
                <span class="sn-form__error"
                      th:if="${#fields.hasErrors('address')}"
                      th:errors="*{address}"></span>
            </div>

            <div class="sn-form__group" th:classappend="${#fields.hasErrors('subnetId')} ? ' sn-form__group--error'">
                <label for="subnetId" class="sn-form__label">
                    <span th:text="#{address.form.subnet.label}">Sous-réseau</span> <span class="sn-form-required">*</span>
                </label>
                <select id="subnetId" th:field="*{subnetId}" class="sn-input" required aria-required="true">
                    <option value="" th:text="#{select.placeholder.subnet}">— Sélectionner un sous-réseau —</option>
                    <option th:each="s : ${allSubnets}"
                            th:value="${s.id}"
                            th:text="|${s.network} — ${s.siteName}|">Subnet</option>
                </select>
                <span class="sn-form__error"
                      th:if="${#fields.hasErrors('subnetId')}"
                      th:errors="*{subnetId}"></span>
            </div>
            <div class="sn-form__group"
                 data-ip-suggestion
                 data-subnet-select-id="subnetId"
                 data-address-input-id="address"
                 data-count="5">
                <button type="button"
                        class="sn-btn sn-btn--ghost"
                        data-ip-suggest-button
                        disabled
                        th:text="#{address.form.suggest.button}">
                    Suggérer une IP disponible
                </button>
                <div class="sn-form__error" data-ip-suggest-message th:text="#{address.form.suggest.hint}">
                    Sélectionnez un sous-réseau pour activer la suggestion.
                </div>
                <div data-ip-suggest-results hidden></div>
            </div>

            <div class="sn-form__group" th:classappend="${#fields.hasErrors('hostname')} ? ' sn-form__group--error'">
                <label for="hostname" class="sn-form__label" th:text="#{table.hostname}">Hostname</label>
                <input type="text"
                       id="hostname"
                       th:field="*{hostname}"
                       class="sn-input"
                       th:placeholder="#{address.form.hostname.placeholder}"
                       autocomplete="off"
                       maxlength="100" />
                <span class="sn-form__error"
                      th:if="${#fields.hasErrors('hostname')}"
                      th:errors="*{hostname}"></span>
            </div>

            <div class="sn-form__group" th:classappend="${#fields.hasErrors('mac')} ? ' sn-form__group--error'">
                <label for="mac" class="sn-form__label" th:text="#{address.form.mac.label}">Adresse MAC</label>
                <input type="text"
                       id="mac"
                       th:field="*{mac}"
                       class="sn-input sn-text-mono"
                       th:placeholder="#{address.form.mac.placeholder}"
                       autocomplete="off"
                       maxlength="17" />
                <span class="sn-form__error"
                      th:if="${#fields.hasErrors('mac')}"
                      th:errors="*{mac}"></span>
            </div>

            <div class="sn-form__group" th:classappend="${#fields.hasErrors('description')} ? ' sn-form__group--error'">
                <label for="description" class="sn-form__label" th:text="#{common.description}">Description</label>
                <textarea id="description"
                          th:field="*{description}"
                          class="sn-input"
                          rows="2"
                          th:placeholder="#{form.description.placeholder}"
                          maxlength="500"></textarea>
                <span class="sn-form__error"
                      th:if="${#fields.hasErrors('description')}"
                      th:errors="*{description}"></span>
            </div>

            <div class="sn-form__group sn-form__group--checkbox">
                <label class="sn-chip-checkbox">
                    <input type="checkbox" th:field="*{temporary}" class="sn-chip-checkbox__input" />
                    <span class="sn-chip-checkbox__pill" th:text="#{address.form.temporary.label}">IP temporaire</span>
                </label>
            </div>

            <div class="sn-form__actions">
                <button type="submit" class="sn-btn sn-btn--primary" th:text="#{common.save}">Enregistrer</button>
                <a th:href="${cancelUrl}" class="sn-btn sn-btn--secondary" th:text="#{common.cancel}">Annuler</a>
            </div>

        </form>
    </div>

</div>
</div>
</body>
</html>
