# --- Admin help: utilisateurs-roles.html ---
helpAdmin.usersRoles.subtitle=Gestion des comptes, rôles disponibles, révocation de jetons et récupération d'urgence.
helpAdmin.usersRoles.roles.title=Rôles disponibles
helpAdmin.roles.table.role=Rôle
helpAdmin.roles.table.rights=Droits
helpAdmin.roles.admin.desc=Accès complet, gestion des utilisateurs et de l'administration
helpAdmin.roles.readonly.desc=Consultation des données des contextes autorisés
helpAdmin.roles.network.desc=Création et modification des contextes, sites, VLAN, sous-réseaux et scans
helpAdmin.roles.ip.desc=Création, modification, suppression, import et export d'adresses IP
helpAdmin.roles.backup.desc=Accès limité à <code>/admin/backup</code> (configuration, déclenchement, import, restauration, historique) — sans le reste de l'administration
helpAdmin.usersRoles.rolesCombo=Les rôles peuvent être cumulés : un utilisateur <code>ROLE_NETWORK</code> + <code>ROLE_IP</code> administre l'exploitation réseau et les adresses IP sans accès à l'administration de l'application. Pour un compte d'automatisation en lecture seule, attribuer <code>ROLE_READ_ONLY</code> et limiter son périmètre aux contextes nécessaires. <code>ROLE_BACKUP</code> convient à un compte de service ou un opérateur dédié aux sauvegardes.
helpAdmin.usersRoles.accounts.title=Gestion des comptes
helpAdmin.usersRoles.accounts.body=Menu <em>Administration → Comptes</em> (<code>/admin/users</code>). Chaque compte local est créé avec un mot de passe temporaire ; l'utilisateur est contraint de le changer à la première connexion (<code>mustChangePassword</code>) avant de pouvoir utiliser l'application ou obtenir un jeton API. Un administrateur peut réinitialiser le mot de passe d'un compte local depuis l'écran de détail utilisateur — cela réactive aussi la contrainte de changement obligatoire.
helpAdmin.usersRoles.tokens.title=Révocation des jetons API
helpAdmin.usersRoles.tokens.body=Depuis l'écran de détail d'un utilisateur, l'action <strong>Invalider les jetons</strong> invalide globalement tous les jetons JWT API déjà émis pour ce compte — les nouveaux jetons émis après l'action restent valides. Ce mécanisme se déclenche aussi automatiquement lors d'un changement de mot de passe ou d'une réinitialisation administrative, pour éviter qu'un ancien jeton reste utilisable après une modification sensible.
helpAdmin.usersRoles.tokens.alert=Cette invalidation ne concerne que les jetons API JWT. Elle ne déconnecte pas les sessions Web déjà ouvertes.
helpAdmin.usersRoles.mfa.title=Authentification à deux facteurs (MFA) — vue administrateur
helpAdmin.usersRoles.mfa.prefix=Chaque compte local peut activer le MFA depuis son propre profil (voir
helpAdmin.usersRoles.mfa.linkText=le guide utilisateur
helpAdmin.usersRoles.mfa.suffix=). Les comptes LDAP ne sont pas concernés.
helpAdmin.usersRoles.mfaRecovery.title=Récupération en cas de perte du mot de passe ET du MFA
helpAdmin.usersRoles.mfaRecovery.body1=Si un compte perd l'accès à son mot de passe et à son application d'authentification (et que les codes de récupération n'ont pas été conservés), aucune récupération en libre-service n'est possible : Subnetory n'envoie pas d'email et ne propose pas de lien de réinitialisation par courrier électronique.
helpAdmin.usersRoles.mfaRecovery.body2=Si un autre compte <code>ROLE_ADMIN</code> existe, c'est la voie normale de récupération, entièrement depuis l'interface : depuis <code>/admin/users</code>, ouvrir la fiche du compte bloqué et réinitialiser son mot de passe. Cela ne désactive pas le MFA.
helpAdmin.usersRoles.mfaRecovery.body3=Sur cette même fiche (<code>/admin/users/{id}</code>), section MFA, le bouton <strong>« Désactiver le MFA »</strong> retire le second facteur du compte sans toucher au mot de passe — action anti-lockout prévue précisément pour ce cas. Réinitialiser le mot de passe puis désactiver le MFA suffit donc à débloquer entièrement le compte, sans aucune intervention en base de données.
helpAdmin.usersRoles.mfaRecovery.warning=<strong>Seulement si aucun autre compte admin n'existe</strong>, le recours devient un accès direct à la base PostgreSQL — procédure de secours à n'utiliser qu'en dernier ressort, par une personne de confiance ayant accès au serveur. Détail complet (requêtes SQL, génération du hash bcrypt) dans <code>backend/docs/ADMIN_GUIDE.md</code>, section « Authentification à deux facteurs (MFA) ».
helpAdmin.usersRoles.mfaRecovery.bestPractice=Bonne pratique : maintenir au moins deux comptes <code>ROLE_ADMIN</code> actifs, pour ne jamais dépendre d'un compte unique.
helpAdmin.usersRoles.ldap.body=Menu <em>Administration → LDAP</em> (<code>/admin/ldap</code>) : configuration de l'annuaire, filtre de recherche utilisateur, rôles par défaut attribués à l'auto-provisionnement, et diagnostic de connexion.

