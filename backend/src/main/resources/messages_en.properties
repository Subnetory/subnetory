# --- User help: prise-en-main.html ---
help.gettingStarted.subtitle=What Subnetory does, how your network is organized, and the very first steps.
help.gettingStarted.what.title=What is Subnetory?
help.gettingStarted.what.body=Subnetory is a lightweight, self-hosted IP address management (IPAM) tool. It lets you keep an inventory of your IPv4 subnets, record and search IP addresses with their metadata (hostname, MAC, description), quickly find available addresses in a subnet, import and export addresses in CSV or Excel, and manage multiple routing contexts (VRFs) and multiple sites.
help.gettingStarted.hierarchy.title=How your network is organized
help.gettingStarted.hierarchy.intro=Subnetory organizes data according to a four-level hierarchy:
help.gettingStarted.hierarchy.label=Hierarchy
help.gettingStarted.hierarchy.diagram=Context (VRF) → Site → VLAN (optional) and Subnet → IP address
help.gettingStarted.hierarchy.body=A <strong>context</strong> represents a routing space (VRF, routing table) — useful if you manage several clients or isolated environments. A <strong>site</strong> is a physical or logical location attached to a context. A <strong>VLAN</strong> is optional and attaches to a site. A <strong>subnet</strong> (e.g. <code>192.168.1.0/24</code>) attaches to a site and can be associated with a VLAN. Each <strong>IP address</strong> belongs to a subnet.
help.gettingStarted.steps.title=The very first steps
help.gettingStarted.step1=<strong>Create a context</strong> — menu <em>Contexts → New context</em>. One is enough if you only manage a single environment.<br><span class="sn-text-muted sn-help-permission">Required permissions: <code>ROLE_ADMIN</code> only.</span>
help.gettingStarted.step2=<strong>Create a site</strong> — menu <em>Sites → New site</em>, attached to the context created in the previous step.<br><span class="sn-text-muted sn-help-permission">Required permissions: <code>ROLE_ADMIN</code> or <code>ROLE_NETWORK</code>.</span>
help.gettingStarted.step3=<strong>Create a VLAN</strong> (optional) — menu <em>VLANs → New VLAN</em>.<br><span class="sn-text-muted sn-help-permission">Required permissions: <code>ROLE_ADMIN</code> or <code>ROLE_NETWORK</code>.</span>
help.gettingStarted.step4=<strong>Create a subnet</strong> — menu <em>Subnets → New subnet</em>, for example <code>192.168.1.0/24</code> with gateway <code>192.168.1.1</code>.<br><span class="sn-text-muted sn-help-permission">Required permissions: <code>ROLE_ADMIN</code> or <code>ROLE_NETWORK</code>.</span>
help.gettingStarted.step5.prefix=<strong>Create an IP address</strong> — menu <em>IP Addresses → New address</em>. See
help.gettingStarted.step5.linkText=the dedicated guide
help.gettingStarted.step5.suffix=for the available-IP suggestion assistant.
help.gettingStarted.step5.permission=Required permissions: <code>ROLE_ADMIN</code> or <code>ROLE_IP</code>.
help.gettingStarted.activeContext.title=The active context selector
help.gettingStarted.activeContext.body=At the top of every page is an <strong>active context</strong> selector. Once a context is selected, all lists (sites, VLANs, subnets, addresses) are filtered to that context, and newly created resources are automatically attached to it. A banner reminds you of the active context at the top of the page. The ↺ button next to the selector resets the filter to see all contexts again.
help.gettingStarted.further.title=Going further
help.gettingStarted.further.network=organize your network hierarchy.
help.gettingStarted.further.addresses=create, search and reserve addresses.
help.gettingStarted.further.importExport=pick up an existing inventory.

# --- User help: reseau.html ---
help.network.subtitle=Organize your network hierarchy and run a discovery scan.
help.network.contexts.title=Contexts
help.network.contexts.body=A context represents a routing space (VRF, routing table). It isolates one client's or environment's data from others: sites, VLANs, subnets and addresses created in a context do not appear in another context's lists until the active context selector is changed. Menu <em>Contexts → New context</em>.
help.network.sites.title=Sites
help.network.sites.body=A site is a physical or logical location attached to a context (for example a building, a branch, a datacenter). Menu <em>Sites → New site</em>.
help.network.vlans.title=VLANs
help.network.vlans.body=A VLAN attaches to a site; it is optional — many subnets do not need one. Its identifier (VLAN ID) must be between 0 and 4094. Menu <em>VLANs → New VLAN</em>.
help.network.subnets.title=Subnets
help.network.subnets.body=A subnet attaches to a site and can be associated with a VLAN. Menu <em>Subnets → New subnet</em>. Example: network <code>192.168.1.0/24</code>, gateway <code>192.168.1.1</code>.
help.network.available.title=Suggested available address
help.network.available.body=When creating an address (<em>IP addresses → New address</em>), once a subnet is selected, the <strong>Suggest an available IP</strong> button proposes up to 5 free IPs from the block — handy for picking the next address to assign without manual calculation.
help.network.scan.title=Discovery scan
help.network.scan.body=In the subnet list, a scannable subnet shows a <strong>Configure</strong> link in the "Scan" column. It opens a configuration screen (DNS resolution, ARP ping, scan timing) where the <strong>Launch scan</strong> button triggers the network discovery (Nmap, <code>-sn</code> mode, no privilege elevation). Useful for spotting currently reachable hosts and reconciling the result with the declared inventory.
help.network.scan.sizeLimit=Scanning is only offered for subnets with a <code>/24</code> mask or more specific (for example <code>/24</code>, <code>/28</code>, <code>/30</code>); larger blocks (<code>/23</code>, <code>/16</code>…) are not scannable from the interface.
help.network.scan.warning=The application container deliberately runs without extended network privileges (no <code>privileged</code> mode, no layer-2 ARP discovery). The scan remains useful for routed IP discovery, but should not be considered an exhaustive ARP inventory of the local network — MAC addresses in particular are generally unavailable outside the segment visible to the container.
help.network.further.title=Going further
help.network.further.addresses=create, search and reserve addresses in these subnets.

# --- User help: adresses-ip.html ---
help.addresses.subtitle=Create, search, bulk-reserve and edit IP addresses.
help.addresses.create.title=Create an address
help.addresses.create.body=Menu <em>IP Addresses → New address</em>. An address always belongs to a subnet; the hostname, MAC address and description fields are optional.
help.addresses.create.permission=Required permissions: <code>ROLE_ADMIN</code> or <code>ROLE_IP</code>.
help.addresses.wizard.title=Available IP assistant
help.addresses.wizard.body=Once a subnet is selected in the form, the <strong>Suggest an available IP</strong> button becomes active. Clicking a suggested IP automatically fills in the address field — avoiding manual calculation of which addresses in the block are already taken.
help.addresses.bulkReserve.title=Bulk reservation
help.addresses.bulkReserve.body=Menu <em>IP Addresses → ⊞ Reserve multiple IPs</em>. This tool generates up to 50 available addresses from a chosen subnet, as an editable table: fill in descriptions or hostnames row by row, then reserve all rows in a single click. Handy for preparing a batch of addresses before a deployment.
help.addresses.bulkReserve.permission=Required permissions: <code>ROLE_ADMIN</code> or <code>ROLE_IP</code>.
help.addresses.search.title=Search for an address
help.addresses.search.body=Menu <em>IP Addresses</em>. Available filters: free-text search, hostname, MAC address. The list is paginated (25 addresses per page).
help.addresses.export.title=Export
help.addresses.export.body=<strong>↓ CSV</strong> and <strong>↓ Excel</strong> buttons available on the <em>IP Addresses</em> and <em>Subnets</em> pages. The filters active at export time are applied to the generated file.
help.addresses.further.title=Going further
help.addresses.further.importExport=pick up an existing inventory in CSV or Excel.

# --- User help: import-export.html ---
help.importExport.subtitle=Pick up an existing inventory in CSV or Excel, and understand the expected format.
help.importExport.import.title=Importing addresses
help.importExport.import.body1=Menu <em>IP Addresses → ⇧ Import</em>. Accepted formats: <strong>CSV</strong> and <strong>Excel (.xlsx)</strong>, with the same columns and the same rules for both formats.
help.importExport.import.body2=After import, a report is shown with the number of rows processed, created, updated and in error — with row-by-row detail for errors.
help.importExport.import.permission=Required permissions: <code>ROLE_ADMIN</code> or <code>ROLE_IP</code>.
help.importExport.columns.title=Expected columns
help.importExport.table.column=Column
help.importExport.table.required=Required
help.importExport.table.description=Description
help.importExport.col.address.required=Yes
help.importExport.col.address.desc=IPv4 address, e.g. <code>192.168.1.10</code>
help.importExport.col.subnetId.desc=Numeric subnet ID
help.importExport.col.subnetNetwork.desc=CIDR network, e.g. <code>192.168.1.0/24</code>
help.importExport.col.optional=No
help.importExport.col.mac.desc=MAC address
help.importExport.col.hostname.desc=Hostname
help.importExport.col.description.desc=Free-text description
help.importExport.col.temporary.desc=<code>true</code> or <code>false</code>, default <code>false</code>
help.importExport.col.discoverySource.desc=manual / api / csv / xlsx / nmap / arp-scan / dns
help.importExport.columns.body=If <code>subnet_id</code> is provided, it is used directly and the subnet must already exist. If only <code>subnet_network</code> is provided, Subnetory looks up the matching subnet — if several subnets share the same CIDR, the row is rejected for ambiguity. If both are provided, <code>subnet_id</code> takes priority.
help.importExport.csvExample.title=CSV example
help.importExport.csvExample.fileLabel=.csv file
help.importExport.behavior.title=Behavior depending on whether the address exists
help.importExport.table.state=State
help.importExport.table.defaultBehavior=Default behavior
help.importExport.table.replaceBehavior=With "replace existing"
help.importExport.state.absent=IP absent
help.importExport.state.absent.default=Full creation
help.importExport.state.existing=IP existing
help.importExport.state.existing.default=Only the last-seen timestamp is updated
help.importExport.state.existing.replace=Provided fields are updated
help.importExport.behavior.body=The <strong>Replace existing addresses</strong> option in the import form determines this behavior: unchecked, an already-known IP is never overwritten — only a conflict is reported without modification.
help.importExport.export.title=Export
help.importExport.export.body=<strong>↓ CSV</strong> and <strong>↓ Excel</strong> buttons on the <em>IP Addresses</em> and <em>Subnets</em> pages, with the active filters applied to the generated file.

# --- User help: compte-securite.html ---
help.account.subtitle=Change your password and enable two-factor authentication (MFA).
help.account.password.title=Changing your password
help.account.password.body=Menu <em>Profile → Change password</em>. Reserved for local accounts — LDAP accounts have their password managed by the company directory, not from Subnetory.
help.account.password.policy=Password policy: between 12 and 128 characters, with at least one uppercase letter, one lowercase letter, one digit and one special character.
help.account.mfa.title=Two-factor authentication (MFA)
help.account.mfa.body=Each local account can enable a second TOTP factor (compatible with Google Authenticator, Authy, etc.) from its profile. MFA is optional: it is never imposed automatically. LDAP accounts are not affected.
help.account.mfa.enable.title=Enabling MFA
help.account.mfa.enable.step1=Menu <em>Profile → Two-factor authentication (MFA) → Enable MFA</em>.
help.account.mfa.enable.step2=Scan the displayed QR code with an authenticator app, or enter the key manually if scanning is not possible.
help.account.mfa.enable.step3=Enter the 6-digit code generated by the app to confirm.
help.account.mfa.enable.step4=<strong>Write down the 10 recovery codes shown immediately</strong>: they will never be shown again afterwards. Keep them in a password manager or a safe, never in plain text on the workstation.
help.account.mfa.login.title=Logging in with MFA active
help.account.mfa.login.body=After username and password, a dedicated page asks for the TOTP code (or a recovery code). A recovery code can replace the TOTP code for login, disabling MFA, or regenerating codes — each recovery code can only be used once.
help.account.mfa.manage.title=Disabling MFA or regenerating codes
help.account.mfa.manage.body=From <em>Profile</em>, once MFA is active: regenerate the 10 recovery codes (invalidates the old ones), or disable MFA. Both actions require a valid MFA code; disabling additionally requires the current password.
help.account.mfa.lockout.warning=<strong>Loss of access</strong> (device and recovery codes lost): if another administrator account exists, it can disable your account's MFA from the user detail screen. If no other administrator account exists, contact the person in charge of server operations — an emergency procedure exists but requires direct access to the database.

# --- User help: api.html ---
help.api.subtitle=Subnetory is API-first: every action possible in the interface is also available via the API.
help.api.docs.title=Interactive documentation
help.api.docs.body=Every action possible in the interface is also available via the API — endpoints, request and response schemas, generated directly from the code and therefore always accurate.
help.api.docs.swaggerButton=Open Swagger UI
help.api.docs.openapiButton=OpenAPI specification (JSON)
help.api.auth.title=Authentication
help.api.auth.intro=Obtain a JWT token with your credentials:
help.api.auth.getTokenLabel=Get a token
help.api.auth.mfaIntro=If MFA is active on the account, add the <code>totpCode</code> field (or a recovery code) to the request body:
help.api.auth.withMfaLabel=With MFA
help.api.auth.useTokenIntro=Use the obtained token:
help.api.auth.callApiLabel=Call the API
help.api.revoke.title=Revoking a token
help.api.revoke.body=API JWT tokens can be revoked before their natural expiration, individually or globally for your account:
help.api.revoke.logoutLabel=Logout (this token only)
help.api.revoke.logoutAllLabel=Invalidate all my existing tokens
help.api.automation.title=Automation accounts
help.api.automation.body=Every local account is created with a temporary password that must be replaced before any normal use — issuing a token is refused (<code>403 PASSWORD_CHANGE_REQUIRED</code>) until this change has taken place.
help.api.automation.changePasswordLabel=Replace the temporary password (no token required)
help.api.automation.readOnlyHint=For a read-only service account limited to a scope, assign the <code>ROLE_READ_ONLY</code> role and restrict its authorized contexts.
help.api.monitoring.title=Monitoring
help.api.monitoring.intro=Application health status, accessible without authentication:
help.api.monitoring.button=Check /actuator/health

