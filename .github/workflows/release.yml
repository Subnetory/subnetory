name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write    # créer la GitHub Release et attacher le JAR
  packages: write    # pousser l'image vers GHCR
  id-token: write    # signature Cosign "keyless" via OIDC (troisieme audit externe, constat M-03, 04/08/2026)

jobs:
  release:
    runs-on: ubuntu-latest

    outputs:
      image_name: ${{ steps.image.outputs.name }}

    steps:
      # Actions tierces epinglees sur leur commit SHA complet, jamais un tag
      # mutable (audit 03/08/2026) : un tag comme "@v7" peut etre re-pousse
      # vers un commit different par le mainteneur (volontairement ou apres
      # compromission du depot, cf. l'incident aquasecurity/trivy-action de
      # mars 2026 documente dans ci.yml). Le SHA, lui, est immuable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Garde-fou (audit 03/08/2026) : v0.8.1 a ete publiee avec un pom.xml
      # encore en -SNAPSHOT et un chart Helm pointant vers l'image v0.8.0 par
      # defaut, sans qu'aucune verification automatique ne l'empeche. Refuse
      # desormais de construire quoi que ce soit si le depot n'est pas
      # coherent avec le tag pousse. Voir scripts/verify-release-consistency.sh.
      - name: Verify release consistency
        run: bash scripts/verify-release-consistency.sh "$GITHUB_REF_NAME"

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x ./mvnw

      # Tests complets + seuils de couverture JaCoCo avant publication : un
      # tag pousse sur un commit dont les tests ou la couverture echouent ne
      # doit jamais publier de JAR ni d'image GHCR.
      - name: Build and verify JAR
        working-directory: backend
        run: ./mvnw clean verify -B

      # github.repository retourne "Subnetory/subnetory" avec une majuscule.
      # Docker exige des noms d'image en minuscules — conversion obligatoire.
      - name: Normalize image name to lowercase
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" \
            >> "$GITHUB_OUTPUT"

      # Correctif regression (05/08/2026, premier run reel du tag v0.8.7,
      # troisieme audit externe, constat M-03) : sans cette etape, Buildx
      # utilise par defaut le driver "docker", qui ne supporte pas les
      # attestations SBOM/provenance demandees ci-dessous ("Attestation is
      # not supported for the docker driver"). Le driver "docker-container"
      # cree par cette action les supporte.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produit les tags :
      #   ghcr.io/subnetory/subnetory:v1.0.0
      #   ghcr.io/subnetory/subnetory:latest
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest

      # SBOM (bill of materials) et attestation de provenance SLSA generees
      # nativement par BuildKit (troisieme audit externe, constat M-03,
      # 04/08/2026) : aucun outil supplementaire a maintenir, seulement deux
      # options sur l'action de build deja utilisee. Publiees comme
      # "referrers" OCI aux cotes de l'image sur GHCR — verifiables via
      # `docker buildx imagetools inspect --format '{{ json .SBOM }}' <image>`
      # ou `cosign verify-attestation` (voir signature ci-dessous).
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true

      # Installation de Cosign (troisieme audit externe, constat M-03,
      # 04/08/2026) : action officielle Sigstore, epinglee sur son commit SHA
      # complet comme toute action tierce de ce depot.
      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      # Signature "keyless" de l'image publiee (troisieme audit externe,
      # constat M-03, 04/08/2026) : utilise le jeton OIDC de ce run GitHub
      # Actions comme identite (Fulcio/Rekor, ecosysteme Sigstore) — aucune
      # cle privee a generer, stocker ni faire tourner. Signe par digest
      # (steps.build.outputs.digest), pas par tag : un tag est mutable, un
      # digest ne l'est jamais. Verification cote utilisateur :
      #   cosign verify ghcr.io/subnetory/subnetory@<digest> \
      #     --certificate-identity-regexp 'https://github.com/Subnetory/subnetory/.github/workflows/release.yml@.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the published image (keyless, GitHub OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
          cosign sign --yes "${image}"

      # Correctif securite MOYENNE (audit 04/08/2026 ; etendu le 04/08/2026,
      # troisieme audit externe, constat M-03) : la release ne fournissait
      # jusqu'ici qu'un JAR sans aucun moyen de verifier son integrite apres
      # telechargement au-dela d'un simple hash. SHA256SUMS.txt couvre
      # desormais aussi le SBOM CycloneDX du JAR (genere par
      # cyclonedx-maven-plugin au "mvn package" ci-dessus, voir ci-dessous
      # pour son chemin reel), et l'ensemble est en plus signe par Cosign
      # (voir etape suivante) — pas seulement verifiable, mais rattachable
      # de maniere verifiable a ce run CI precis via l'identite OIDC GitHub.
      # Correctif regression (05/08/2026, premier run reel du tag v0.8.7) :
      # cyclonedx-maven-plugin ignore <outputFormat>/<outputName> (backend/pom.xml)
      # des qu'il detecte spring-boot-maven-plugin dans le meme build, et ecrit
      # a la place dans target/classes/META-INF/sbom/application.cdx.json (son
      # propre defaut pour l'integration Spring Boot / Actuator SBOM) — jamais
      # a la racine de target/ comme le nom du plugin le laisserait supposer.
      - name: Generate SHA-256 checksums for release assets
        working-directory: backend/target
        run: |
          set -euo pipefail
          cp classes/META-INF/sbom/application.cdx.json subnetory-bom.json
          sha256sum subnetory-*.jar subnetory-bom.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signature "keyless" de SHA256SUMS.txt (troisieme audit externe,
      # constat M-03, 04/08/2026) : couvre transitivement le JAR et le SBOM
      # (leurs hashes y figurent). Verification cote utilisateur :
      #   cosign verify-blob SHA256SUMS.txt \
      #     --bundle SHA256SUMS.txt.sigstore.json \
      #     --certificate-identity-regexp 'https://github.com/Subnetory/subnetory/.github/workflows/release.yml@.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      #
      # Correctif regression (05/08/2026, premier run allant jusqu'a cette
      # etape, troisieme audit externe, constat M-03) : la version de Cosign
      # installee ici bascule par defaut sur le "nouveau format de bundle"
      # (un seul fichier JSON regroupant signature+certificat+preuve
      # transparency-log), ou --output-signature/--output-certificate sont
      # ignores silencieusement — sign-blob echouait alors en tentant
      # d'ouvrir un chemin de bundle vide, faute de --bundle explicite.
      # Adopte le format recommande par la documentation Sigstore plutot que
      # de forcer l'ancien comportement (--new-bundle-format=false).
      - name: Sign release checksums (keyless, GitHub OIDC)
        working-directory: backend/target
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle SHA256SUMS.txt.sigstore.json \
            SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            backend/target/subnetory-*.jar
            backend/target/subnetory-bom.json
            backend/target/SHA256SUMS.txt
            backend/target/SHA256SUMS.txt.sigstore.json

  # Smoke test post-release (audit 03/08/2026) : v0.8.1 a ete publiee avec
  # un chart Helm dont l'image par defaut pointait encore vers v0.8.0, sans
  # que rien ne le detecte automatiquement — le job "helm-smoke" de ci.yml
  # construit une image locale, il ne tire jamais l'image reellement
  # publiee. Ce job pull l'image GHCR qui vient d'etre publiee sous le tag
  # de cette release (pas "latest", le tag exact) via le meme
  # docker-compose.yml que l'installation reelle, et verifie qu'elle
  # demarre et repond effectivement. N'annule pas la release si elle
  # echoue (deja publiee), mais le fait apparaitre clairement en rouge.
  post-release-smoke:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate local Compose secrets
        run: bash scripts/init-compose.sh

      - name: Pull and start the just-published image
        env:
          SUBNETORY_SMOKE_IMAGE: ${{ needs.release.outputs.image_name }}:${{ github.ref_name }}
        run: |
          docker compose -f backend/docker-compose.yml -f backend/docker-compose.release-smoke.yml up -d --no-build

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health/readiness 2>/dev/null | grep -q '"status":"UP"'; then
              echo "Image publiee prete apres $((i * 5))s."
              exit 0
            fi
            sleep 5
          done
          echo "L'image publiee n'est jamais devenue prete (readiness KO apres 150s)." >&2
          docker compose -f backend/docker-compose.yml -f backend/docker-compose.release-smoke.yml logs >&2
          exit 1

      - name: Tear down
        if: always()
        run: docker compose -f backend/docker-compose.yml -f backend/docker-compose.release-smoke.yml down -v