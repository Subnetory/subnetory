help.card.gettingStarted.desc=Qu'est-ce que Subnetory, comment est organisé votre réseau (contexte → site → VLAN → sous-réseau → adresse), et les toutes premières étapes.
help.card.network.title=Contextes, sites, VLAN & sous-réseaux
