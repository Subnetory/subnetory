name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write    # créer la GitHub Release et attacher le JAR
  packages: write    # pousser l'image vers GHCR

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x ./mvnw

      - name: Build JAR
        working-directory: backend
        run: ./mvnw package -DskipTests -B

      # github.repository retourne "Subnetory/subnetory" avec une majuscule.
      # Docker exige des noms d'image en minuscules — conversion obligatoire.
      - name: Normalize image name to lowercase
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" \
            >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produit les tags :
      #   ghcr.io/subnetory/subnetory:v1.0.0
      #   ghcr.io/subnetory/subnetory:latest
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: backend/target/subnetory-*.jar