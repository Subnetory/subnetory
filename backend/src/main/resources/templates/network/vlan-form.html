<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::#main-content})}">
<body>
<div id="main-content">
<div class="sn-page">

    <div class="sn-page__header">
        <div>
            <h1 class="sn-page__title" th:text="${pageTitle}">VLAN</h1>
            <p class="sn-page__subtitle" th:text="#{vlan.form.subtitle}">Rattachez ce VLAN à un site pour l'associer à vos sous-réseaux.</p>
        </div>
    </div>

    <div th:if="${formError}" class="sn-alert sn-alert--error" th:text="${formError}"></div>

    <div class="sn-card sn-card--padded sn-form-card">
        <div class="sn-card__header">
            <h2 class="sn-card__title" th:text="${pageTitle}">VLAN</h2>
        </div>

        <form th:action="${formAction}" th:object="${form}" method="post" novalidate class="sn-form">

            <input type="hidden" th:field="*{id}" />

            <div class="sn-form__group" th:classappend="${#fields.hasErrors('vid')} ? ' sn-form__group--error'">
                <label for="vid" class="sn-form__label">
                    <span th:text="#{vlan.form.vid.label}">VLAN ID</span> <span class="sn-form-required">*</span>
                </label>
                <input type="number"
                       id="vid"
                       th:field="*{vid}"
                       class="sn-input"
                       th:placeholder="#{vlan.form.vid.placeholder}"
                       min="0"
                       max="4094"
                       required
                       aria-required="true" />
                <span class="sn-form__error"
                      th:if="${#fields.hasErrors('vid')}"
                      th:errors="*{vid}"></span>
            </div>

            <div class="sn-form__group" th:classappend="${#fields.hasErrors('name')} ? ' sn-form__group--error'">
                <label for="name" class="sn-form__label" th:text="#{common.name}">Nom</label>
                <input type="text"
                       id="name"
                       th:field="*{name}"
                       class="sn-input"
                       th:placeholder="#{vlan.form.name.placeholder}"
                       autocomplete="off"
                       maxlength="100" />
                <span class="sn-form__error"
                      th:if="${#fields.hasErrors('name')}"
                      th:errors="*{name}"></span>
            </div>

            <div class="sn-form__group" th:classappend="${#fields.hasErrors('siteId')} ? ' sn-form__group--error'">
                <label for="siteId" class="sn-form__label">
                    <span th:text="#{common.site}">Site</span> <span class="sn-form-required">*</span>
                </label>
                <select id="siteId"
                        th:field="*{siteId}"
                        class="sn-input"
                        required
                        aria-required="true">
                    <option value="" th:text="#{select.placeholder.site}">— Sélectionner un site —</option>
                    <option th:each="site : ${allSites}"
                            th:value="${site.id}"
                            th:text="|${site.code} — ${site.name}|">SITE</option>
                </select>
                <span class="sn-form__error"
                      th:if="${#fields.hasErrors('siteId')}"
                      th:errors="*{siteId}"></span>
            </div>

            <div class="sn-form__actions">
                <button type="submit" class="sn-btn sn-btn--primary" th:text="#{common.save}">Enregistrer</button>
                <a th:href="${cancelUrl}" class="sn-btn sn-btn--secondary" th:text="#{common.cancel}">Annuler</a>
            </div>

        </form>
    </div>

</div>
</div>
</body>
</html>
