# --- User help: prise-en-main.html ---
help.gettingStarted.subtitle=Ce que fait Subnetory, comment est organisé votre réseau, et les toutes premières étapes.
help.gettingStarted.what.title=Qu'est-ce que Subnetory ?
help.gettingStarted.what.body=Subnetory est un outil de gestion d'adresses IP (IPAM) léger et auto-hébergé. Il permet de tenir l'inventaire de vos sous-réseaux IPv4, d'enregistrer et rechercher des adresses IP avec leurs métadonnées (nom d'hôte, MAC, description), de trouver rapidement les adresses disponibles dans un sous-réseau, d'importer et exporter des adresses en CSV ou Excel, et de gérer plusieurs contextes de routage (VRF) et plusieurs sites.
help.gettingStarted.hierarchy.title=Comment est organisé votre réseau
help.gettingStarted.hierarchy.intro=Subnetory range les données selon une hiérarchie à quatre niveaux :
help.gettingStarted.hierarchy.label=Hiérarchie
help.gettingStarted.hierarchy.diagram=Contexte (VRF) → Site → VLAN (optionnel) et Sous-réseau → Adresse IP
help.gettingStarted.hierarchy.body=Un <strong>contexte</strong> représente un espace de routage (VRF, table de routage) — utile si vous gérez plusieurs clients ou environnements cloisonnés. Un <strong>site</strong> est un emplacement physique ou logique rattaché à un contexte. Un <strong>VLAN</strong> est optionnel et se rattache à un site. Un <strong>sous-réseau</strong> (ex. <code>192.168.1.0/24</code>) se rattache à un site et peut être associé à un VLAN. Chaque <strong>adresse IP</strong> appartient à un sous-réseau.
help.gettingStarted.steps.title=Les toutes premières étapes
help.gettingStarted.step1=<strong>Créer un contexte</strong> — menu <em>Contextes → Nouveau contexte</em>. Un seul suffit si vous ne gérez qu'un environnement.<br><span class="sn-text-muted sn-help-permission">Permissions requises : <code>ROLE_ADMIN</code> uniquement.</span>
help.gettingStarted.step2=<strong>Créer un site</strong> — menu <em>Sites → Nouveau site</em>, rattaché au contexte créé à l'étape précédente.<br><span class="sn-text-muted sn-help-permission">Permissions requises : <code>ROLE_ADMIN</code> ou <code>ROLE_NETWORK</code>.</span>
help.gettingStarted.step3=<strong>Créer un VLAN</strong> (optionnel) — menu <em>VLAN → Nouveau VLAN</em>.<br><span class="sn-text-muted sn-help-permission">Permissions requises : <code>ROLE_ADMIN</code> ou <code>ROLE_NETWORK</code>.</span>
help.gettingStarted.step4=<strong>Créer un sous-réseau</strong> — menu <em>Sous-réseaux → Nouveau sous-réseau</em>, par exemple <code>192.168.1.0/24</code> avec la passerelle <code>192.168.1.1</code>.<br><span class="sn-text-muted sn-help-permission">Permissions requises : <code>ROLE_ADMIN</code> ou <code>ROLE_NETWORK</code>.</span>
help.gettingStarted.step5.prefix=<strong>Créer une adresse IP</strong> — menu <em>Adresses IP → Nouvelle adresse</em>. Voir
help.gettingStarted.step5.linkText=le guide dédié
help.gettingStarted.step5.suffix=pour l'assistant de suggestion d'IP disponible.
help.gettingStarted.step5.permission=Permissions requises : <code>ROLE_ADMIN</code> ou <code>ROLE_IP</code>.
help.gettingStarted.activeContext.title=Le sélecteur de contexte actif
help.gettingStarted.activeContext.body=En haut de chaque page se trouve un sélecteur de <strong>contexte actif</strong>. Une fois un contexte sélectionné, toutes les listes (sites, VLAN, sous-réseaux, adresses) sont filtrées à ce contexte, et les nouvelles ressources créées y sont automatiquement rattachées. Un bandeau rappelle le contexte actif en haut de page. Le bouton ↺ à côté du sélecteur réinitialise le filtre pour revoir l'ensemble des contextes.
help.gettingStarted.further.title=Pour aller plus loin
help.gettingStarted.further.network=organiser la hiérarchie de votre réseau.
help.gettingStarted.further.addresses=créer, rechercher et réserver des adresses.
help.gettingStarted.further.importExport=reprendre un inventaire existant.

# --- User help: reseau.html ---
help.network.subtitle=Organiser la hiérarchie de votre réseau et lancer un scan de découverte.
help.network.contexts.title=Contextes
help.network.contexts.body=Un contexte représente un espace de routage (VRF, table de routage). Il isole les données d'un client ou d'un environnement des autres : sites, VLAN, sous-réseaux et adresses créés dans un contexte n'apparaissent pas dans les listes d'un autre contexte tant que le sélecteur de contexte actif n'est pas changé. Menu <em>Contextes → Nouveau contexte</em>.
help.network.sites.title=Sites
help.network.sites.body=Un site est un emplacement physique ou logique rattaché à un contexte (par exemple un bâtiment, une agence, un datacenter). Menu <em>Sites → Nouveau site</em>.
help.network.vlans.title=VLAN
help.network.vlans.body=Un VLAN se rattache à un site ; il est optionnel — beaucoup de sous-réseaux n'en ont pas besoin. Son identifiant (VLAN ID) doit être compris entre 0 et 4094. Menu <em>VLAN → Nouveau VLAN</em>.
help.network.subnets.title=Sous-réseaux
help.network.subnets.body=Un sous-réseau se rattache à un site et peut être associé à un VLAN. Menu <em>Sous-réseaux → Nouveau sous-réseau</em>. Exemple : réseau <code>192.168.1.0/24</code>, passerelle <code>192.168.1.1</code>.
help.network.available.title=Suggestion d'adresse disponible
help.network.available.body=Lors de la création d'une adresse (<em>Adresses IP → Nouvelle adresse</em>), une fois un sous-réseau sélectionné, le bouton <strong>Suggérer une IP disponible</strong> propose jusqu'à 5 IP libres du bloc — pratique pour choisir la prochaine adresse à attribuer sans calcul manuel.
help.network.scan.title=Scan de découverte
help.network.scan.body=Dans la liste des sous-réseaux, un sous-réseau scannable affiche un lien <strong>Configurer</strong> dans la colonne « Scan ». Il ouvre un écran de configuration (résolution DNS, ping ARP, rythme du scan) où le bouton <strong>Lancer le scan</strong> déclenche la découverte réseau (Nmap, mode <code>-sn</code>, sans élévation de privilèges). Utile pour repérer les hôtes actuellement joignables et rapprocher le résultat de l'inventaire déclaré.
help.network.scan.sizeLimit=Le scan n'est proposé que pour les sous-réseaux de masque <code>/24</code> ou plus précis (par exemple <code>/24</code>, <code>/28</code>, <code>/30</code>) ; les blocs plus larges (<code>/23</code>, <code>/16</code>…) ne sont pas scannables depuis l'interface.
help.network.scan.warning=Le conteneur applicatif tourne volontairement sans privilège réseau étendu (pas de mode <code>privileged</code>, pas de découverte ARP de niveau 2). Le scan reste utile pour une découverte IP routée, mais ne doit pas être considéré comme un inventaire ARP exhaustif du réseau local — les adresses MAC en particulier sont généralement indisponibles hors du segment visible par le conteneur.
help.network.further.title=Pour aller plus loin
help.network.further.addresses=créer, rechercher et réserver des adresses dans ces sous-réseaux.

# --- User help: adresses-ip.html ---
help.addresses.subtitle=Créer, rechercher, réserver en masse et modifier des adresses IP.
help.addresses.create.title=Créer une adresse
help.addresses.create.body=Menu <em>Adresses IP → Nouvelle adresse</em>. Une adresse appartient toujours à un sous-réseau ; les champs nom d'hôte, adresse MAC et description sont optionnels.
help.addresses.create.permission=Permissions requises : <code>ROLE_ADMIN</code> ou <code>ROLE_IP</code>.
help.addresses.wizard.title=Assistant IP disponible
help.addresses.wizard.body=Une fois un sous-réseau sélectionné dans le formulaire, le bouton <strong>Suggérer une IP disponible</strong> s'active. Cliquer sur une IP proposée remplit automatiquement le champ adresse — évite de calculer manuellement quelles adresses du bloc sont déjà prises.
help.addresses.bulkReserve.title=Réservation multiple
help.addresses.bulkReserve.body=Menu <em>Adresses IP → ⊞ Réserver plusieurs IP</em>. Cet outil génère jusqu'à 50 adresses disponibles d'un sous-réseau choisi, sous forme de tableau éditable : complétez les descriptions ou noms d'hôte ligne par ligne, puis réservez toutes les lignes en un seul clic. Pratique pour préparer un lot d'adresses avant un déploiement.
help.addresses.bulkReserve.permission=Permissions requises : <code>ROLE_ADMIN</code> ou <code>ROLE_IP</code>.
help.addresses.search.title=Rechercher une adresse
help.addresses.search.body=Menu <em>Adresses IP</em>. Filtres disponibles : recherche libre, nom d'hôte, adresse MAC. La liste est paginée (25 adresses par page).
help.addresses.export.title=Export
help.addresses.export.body=Boutons <strong>↓ CSV</strong> et <strong>↓ Excel</strong> disponibles sur les pages <em>Adresses IP</em> et <em>Sous-réseaux</em>. Les filtres actifs au moment de l'export sont appliqués au fichier généré.
help.addresses.further.title=Pour aller plus loin
help.addresses.further.importExport=reprendre un inventaire existant en CSV ou Excel.

# --- User help: import-export.html ---
help.importExport.subtitle=Reprendre un inventaire existant en CSV ou Excel, et comprendre le format attendu.
help.importExport.import.title=Importer des adresses
help.importExport.import.body1=Menu <em>Adresses IP → ⇧ Importer</em>. Formats acceptés : <strong>CSV</strong> et <strong>Excel (.xlsx)</strong>, avec les mêmes colonnes et les mêmes règles pour les deux formats.
help.importExport.import.body2=Après import, un rapport s'affiche avec le nombre de lignes traitées, créées, mises à jour et en erreur — avec le détail ligne par ligne pour les erreurs.
help.importExport.import.permission=Permissions requises : <code>ROLE_ADMIN</code> ou <code>ROLE_IP</code>.
help.importExport.columns.title=Colonnes attendues
help.importExport.table.column=Colonne
help.importExport.table.required=Obligatoire
help.importExport.table.description=Description
help.importExport.col.address.required=Oui
help.importExport.col.address.desc=Adresse IPv4, ex. <code>192.168.1.10</code>
help.importExport.col.subnetId.desc=ID numérique du sous-réseau
help.importExport.col.subnetNetwork.desc=Réseau CIDR, ex. <code>192.168.1.0/24</code>
help.importExport.col.optional=Non
help.importExport.col.mac.desc=Adresse MAC
help.importExport.col.hostname.desc=Nom d'hôte
help.importExport.col.description.desc=Description libre
help.importExport.col.temporary.desc=<code>true</code> ou <code>false</code>, défaut <code>false</code>
help.importExport.col.discoverySource.desc=manual / api / csv / xlsx / nmap / arp-scan / dns
help.importExport.columns.body=Si <code>subnet_id</code> est fourni, il est utilisé directement et le sous-réseau doit déjà exister. Si seul <code>subnet_network</code> est fourni, Subnetory recherche le sous-réseau correspondant — si plusieurs sous-réseaux partagent le même CIDR, la ligne est rejetée pour ambiguïté. Si les deux sont fournis, <code>subnet_id</code> est prioritaire.
help.importExport.csvExample.title=Exemple CSV
help.importExport.csvExample.fileLabel=fichier .csv
help.importExport.behavior.title=Comportement selon l'existence de l'adresse
help.importExport.table.state=État
help.importExport.table.defaultBehavior=Comportement par défaut
help.importExport.table.replaceBehavior=Avec « remplacer les existantes »
help.importExport.state.absent=IP absente
help.importExport.state.absent.default=Création complète
help.importExport.state.existing=IP existante
help.importExport.state.existing.default=Mise à jour de la dernière observation uniquement
help.importExport.state.existing.replace=Mise à jour des champs fournis
help.importExport.behavior.body=L'option <strong>Remplacer les adresses existantes</strong> du formulaire d'import détermine ce comportement : décochée, une IP déjà connue n'est jamais écrasée — seul un conflit est signalé sans modification.
help.importExport.export.title=Export
help.importExport.export.body=Boutons <strong>↓ CSV</strong> et <strong>↓ Excel</strong> sur les pages <em>Adresses IP</em> et <em>Sous-réseaux</em>, avec les filtres actifs appliqués au fichier généré.

# --- User help: compte-securite.html ---
help.account.subtitle=Changer votre mot de passe et activer l'authentification à deux facteurs (MFA).
help.account.password.title=Changer son mot de passe
help.account.password.body=Menu <em>Profil → Changer le mot de passe</em>. Réservé aux comptes locaux — les comptes LDAP ont leur mot de passe géré par l'annuaire de l'entreprise, pas depuis Subnetory.
help.account.password.policy=Politique de mot de passe : entre 12 et 128 caractères, avec au moins une majuscule, une minuscule, un chiffre et un caractère spécial.
help.account.mfa.title=Authentification à deux facteurs (MFA)
help.account.mfa.body=Chaque compte local peut activer un second facteur TOTP (compatible Google Authenticator, Authy, etc.) depuis son profil. Le MFA est optionnel : il n'est jamais imposé automatiquement. Les comptes LDAP ne sont pas concernés.
help.account.mfa.enable.title=Activer le MFA
help.account.mfa.enable.step1=Menu <em>Profil → Authentification à deux facteurs (MFA) → Activer le MFA</em>.
help.account.mfa.enable.step2=Scanner le QR code affiché avec une application d'authentification, ou saisir la clé manuellement si le scan n'est pas possible.
help.account.mfa.enable.step3=Saisir le code à 6 chiffres généré par l'application pour confirmer.
help.account.mfa.enable.step4=<strong>Noter immédiatement les 10 codes de récupération</strong> affichés : ils ne seront plus jamais montrés ensuite. Les conserver dans un gestionnaire de mots de passe ou un coffre-fort, jamais en clair sur le poste de travail.
help.account.mfa.login.title=Se connecter avec le MFA actif
help.account.mfa.login.body=Après identifiant et mot de passe, une page dédiée demande le code TOTP (ou un code de récupération). Un code de récupération peut remplacer le code TOTP pour la connexion, la désactivation du MFA ou la régénération des codes — chaque code de récupération n'est utilisable qu'une seule fois.
help.account.mfa.manage.title=Désactiver le MFA ou régénérer les codes
help.account.mfa.manage.body=Depuis <em>Profil</em>, une fois le MFA actif : régénérer les 10 codes de récupération (invalide les anciens), ou désactiver le MFA. Les deux actions exigent un code MFA valide ; la désactivation exige en plus le mot de passe actuel.
help.account.mfa.lockout.warning=<strong>Perte d'accès</strong> (appareil et codes de récupération perdus) : si un autre compte administrateur existe, il peut désactiver le MFA de votre compte depuis l'écran de détail utilisateur. Si aucun autre compte administrateur n'existe, contactez la personne en charge de l'exploitation du serveur — une procédure de secours existe mais nécessite un accès direct à la base de données.

# --- User help: api.html ---
help.api.subtitle=Subnetory est API-first : toute action possible dans l'interface est aussi disponible par API.
help.api.docs.title=Documentation interactive
help.api.docs.body=Chaque action possible dans l'interface est aussi disponible par API — endpoints, schémas de requête et de réponse, générés directement depuis le code et donc toujours exacts.
help.api.docs.swaggerButton=Ouvrir Swagger UI
help.api.docs.openapiButton=Spécification OpenAPI (JSON)
help.api.auth.title=Authentification
help.api.auth.intro=Obtenir un jeton JWT avec vos identifiants :
help.api.auth.getTokenLabel=Obtenir un jeton
help.api.auth.mfaIntro=Si le MFA est actif sur le compte, ajouter le champ <code>totpCode</code> (ou un code de récupération) dans le corps de la requête :
help.api.auth.withMfaLabel=Avec MFA
help.api.auth.useTokenIntro=Utiliser le jeton obtenu :
help.api.auth.callApiLabel=Appeler l'API
help.api.revoke.title=Révoquer un jeton
help.api.revoke.body=Les jetons JWT de l'API sont révocables avant leur expiration naturelle, individuellement ou globalement pour votre compte :
help.api.revoke.logoutLabel=Déconnexion (ce jeton uniquement)
help.api.revoke.logoutAllLabel=Invalider tous mes jetons existants
help.api.automation.title=Comptes d'automatisation
help.api.automation.body=Tout compte local est créé avec un mot de passe temporaire qui doit être remplacé avant tout usage normal — l'émission d'un jeton est refusée (<code>403 PASSWORD_CHANGE_REQUIRED</code>) tant que ce changement n'a pas eu lieu.
help.api.automation.changePasswordLabel=Remplacer le mot de passe temporaire (aucun jeton requis)
help.api.automation.readOnlyHint=Pour un compte de service en lecture seule limité à un périmètre, attribuer le rôle <code>ROLE_READ_ONLY</code> et restreindre ses contextes autorisés.
help.api.monitoring.title=Supervision
help.api.monitoring.intro=État de santé de l'application, accessible sans authentification :
help.api.monitoring.button=Vérifier /actuator/health

