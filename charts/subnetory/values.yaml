replicaCount: 1

image:
  # Image publique officielle (audit 03/08/2026) : les valeurs par defaut
  # doivent correspondre a ce que le workflow de release publie reellement
  # sur GHCR, pour qu'un "helm install" sans surcharge fonctionne. Pour un
  # cluster sans acces sortant a ghcr.io, voir backend/docs/INSTALL_KUBERNETES.md
  # (Options B/C) pour construire et charger l'image localement.
  repository: ghcr.io/subnetory/subnetory
  tag: "v0.8.9"
  pullPolicy: IfNotPresent
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

secrets:
  existingSecretRuntime: subnetory-runtime-secrets
  existingSecretBootstrap: subnetory-bootstrap-secrets
  # Cle de chiffrement dediee (audit 02/08/2026) pour les secrets stockes en
  # base (mot de passe de bind LDAP, secret TOTP MFA), separee du secret JWT.
  # false par defaut pour ne pas casser un Secret Kubernetes existant qui ne
  # porte pas encore la cle "encryption-key" : tant que ce flag reste a
  # false, l'application retombe sur le secret JWT comme cle de chiffrement
  # (comportement historique, avec avertissement au demarrage). Pour migrer :
  # ajouter la cle "encryption-key" au Secret existingSecretRuntime ci-dessus
  # (meme longueur/format que jwt-secret), puis passer ce flag a true.
  encryptionKeyEnabled: false
  # Chiffrement des sauvegardes de l'engine in-app (audit 03/08/2026) :
  # meme mecanisme que encryptionKeyEnabled ci-dessus, pour la cle
  # SUBNETORY_BACKUP_ENCRYPTION_KEY (voir backend/docs/BACKUP_ENCRYPTION.md).
  # false par defaut : les sauvegardes de "backupApp" restent en clair tant
  # que ce flag n'est pas active explicitement. Pour l'activer : ajouter la
  # cle "backup-encryption-key" au Secret existingSecretRuntime ci-dessus
  # (contenu = passphrase, jamais commitee), puis passer ce flag a true.
  # Attention : changer/perdre cette cle apres coup rend illisibles toutes
  # les sauvegardes deja chiffrees avec l'ancienne valeur — ce n'est pas
  # une rotation (meme mise en garde que pour Docker Compose).
  backupEncryptionKeyEnabled: false

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

temporaryDirectory:
  sizeLimit: 256Mi

service:
  type: ClusterIP
  port: 8080

application:
  serverPort: 8080
  terminationGracePeriodSeconds: 40
  # Defauts non-vides (correctif securite MOYENNE, audit 04/08/2026) : un
  # chart Helm sans requests/limits laisse un seul pod applicatif consommer
  # des ressources sans borne sur ses voisins du meme cluster (a la
  # difference de Docker Compose, qui tourne generalement isole sur son
  # propre hote). Valeurs de depart prudentes pour une petite/moyenne
  # instance IPAM (JVM Java 21 + Undertow/Tomcat embarque) — ajuster selon la
  # charge reelle observee (nombre d'utilisateurs, frequence des scans Nmap).
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 768Mi
  startupProbe:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 36
  livenessProbe:
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "17.10-alpine3.23"
    pullPolicy: IfNotPresent
  auth:
    database: subnetory
    username: subnetory
  service:
    port: 5432
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
  temporaryDirectory:
    sizeLimit: 64Mi
  runtimeDirectory:
    sizeLimit: 16Mi
  terminationGracePeriodSeconds: 60
  startupProbe:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  livenessProbe:
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # Meme motif que application.resources ci-dessus (correctif securite
  # MOYENNE, audit 04/08/2026).
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

externalDatabase:
  enabled: false
  host: ""
  port: 5432
  database: subnetory
  username: subnetory
  # Correctif securite MOYENNE (audit 04/08/2026) : "prefer" se degrade
  # silencieusement en connexion NON chiffree si le serveur PostgreSQL
  # externe ne propose pas TLS — aucune erreur, aucun avertissement au
  # demarrage. "require" echoue au demarrage si TLS n'est pas disponible :
  # un operateur qui pointe par erreur vers une base sans TLS le decouvre
  # immediatement plutot que de decouvrir plus tard que le trafic circulait
  # en clair. Ne verifie pas l'identite du serveur (pas de protection
  # anti-MITM) — pour cela, passer a "verify-full" et fournir le certificat
  # CA du serveur (voir la documentation JDBC PostgreSQL pour
  # sslrootcert/sslfactory, a ajouter a la chaine de connexion applicative
  # si necessaire).
  sslMode: require

# --- Legacy standalone mechanism (separate CronJob pods running a shell
# script against the postgres image) -----------------------------------
# Superseded by "backupApp" below (Phase 7 audit, 31/07/2026): the new
# in-app engine (dev.subnetory.backup.BackupExecutionService) offers a full
# admin UI, REST API, per-run history, checksum-verified restore and works
# identically in Docker Compose. Kept here for existing deployments that
# already rely on it, and because it does not require postgresql.enabled to
# be paired with the app's own database credentials. Enabling both "backup"
# and "backupApp" at once is rejected by the chart (see templates/configmap.yaml):
# they would each take independent, uncoordinated dumps on their own schedules.
#
# A PVC in the same cluster is not an off-site backup. Copy retained dumps to
# storage managed outside the cluster as part of the operational procedure.
backup:
  enabled: false
  timeZone: Etc/UTC
  persistence:
    existingClaim: ""
    size: 20Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    resourcePolicy: keep
  job:
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    startingDeadlineSeconds: 600
    backoffLimit: 1
    activeDeadlineSeconds: 1800
    temporaryDirectory:
      sizeLimit: 16Mi
    resources: {}
  schedules:
    hourly:
      enabled: false
      schedule: "0 * * * *"
      retentionDays: 2
    daily:
      enabled: true
      schedule: "0 2 * * *"
      retentionDays: 14
    monthly:
      enabled: false
      schedule: "0 3 1 * *"
      retentionDays: 365
    quarterly:
      enabled: false
      schedule: "0 4 1 1,4,7,10 *"
      retentionDays: 730

# --- In-app backup engine (Phase 7 audit, 31/07/2026) -------------------
# pg_dump/pg_restore run inside the application container itself
# (dev.subnetory.backup.BackupExecutionService), identically to Docker
# Compose. Requires postgresql.enabled=true or externalDatabase reachable
# from the app pod (already the case in both configurations). A PVC in the
# same cluster is not an off-site backup — see the note on "backup" above.
backupApp:
  enabled: false
  # Format cron Spring (6 champs : secondes minutes heures jour mois
  # jour-de-semaine), pas le format 5 champs de "backup.schedules.*" ci-dessus.
  cron: "0 0 2 * * *"
  retentionCount: 14
  storagePath: /var/subnetory/backups
  timeoutSeconds: 1800
  persistence:
    existingClaim: ""
    size: 20Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    resourcePolicy: keep

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []
  # Correctif securite ELEVEE (audit 04/08/2026) : sans cette liste, le
  # chart ne positionnait ni SERVER_FORWARD_HEADERS_STRATEGY=framework ni
  # SUBNETORY_SECURITY_TRUSTED_PROXY (voir ClientIpResolver et
  # application.yml). Spring restait alors en forward-headers-strategy=none
  # et ClientIpResolver ne lisait jamais X-Forwarded-For : tous les
  # utilisateurs passant par l'Ingress apparaissaient avec la meme IP (celle
  # du controleur Ingress), ce qui mutualise le rate limiting API (300
  # req/min) et le verrouillage anti-bruteforce (10 echecs = 15 min) entre
  # tous les utilisateurs, et empeche le cookie de session d'obtenir
  # l'attribut Secure derriere une terminaison TLS sur l'Ingress.
  #
  # Obligatoire des que ingress.enabled=true : le chart refuse de rendre les
  # manifests si cette liste est vide (voir templates/configmap.yaml).
  # Valeur = le(s) CIDR depuis lesquels le pod applicatif voit arriver le
  # trafic route par l'Ingress (reseau des pods du cluster la plupart du
  # temps, parfois le reseau du controleur Ingress lui-meme selon le CNI) ;
  # a determiner aupres de votre fournisseur Kubernetes (ex.
  # `kubectl cluster-info dump | grep -i cluster-cidr`).
  trustedProxyCidrs: []

networkPolicy:
  enabled: false
  allowedScanCidrs: []
  externalDatabaseCidrs: []
  # Correctif securite MOYENNE (audit externe 04/08/2026) : par defaut, la
  # regle d'entree applicative n'a pas de "from" — n'importe quel pod du
  # cluster (tout namespace) peut atteindre le port applicatif, pas
  # seulement le controleur Ingress. Volontairement permissif par defaut :
  # le namespace/les labels du controleur Ingress varient selon le
  # fournisseur/l'installation (nginx-ingress, Traefik, LoadBalancer
  # cloud...), impossible d'en deviner un valable pour tous les clusters.
  # Combine a TrustAwareForwardedHeaderFilter (backend/ClientIpResolver),
  # un pod compromis ailleurs dans le cluster ne peut pas usurper l'IP
  # client (le filtre ne fait pas confiance a ses en-tetes), mais reste
  # capable d'atteindre directement l'application — trafic que l'Ingress
  # etait cense filtrer en premier lieu.
  # Renseigner ci-dessous restreint l'entree applicative a exactement ces
  # sources (format NetworkPolicyPeer Kubernetes standard :
  # namespaceSelector / podSelector / ipBlock, fusionne tel quel dans le
  # manifest). Exemple pour nginx-ingress installe dans le namespace
  # "ingress-nginx" (label standard pose par la plupart des installateurs) :
  #   ingressFrom:
  #     - namespaceSelector:
  #         matchLabels:
  #           kubernetes.io/metadata.name: ingress-nginx
  ingressFrom: []
  # Garde-fou (troisieme audit externe, constat M-02, 04/08/2026) : quand
  # ingress.enabled=true ET networkPolicy.enabled=true, le rendu du chart
  # refuse par defaut de continuer tant qu'ingressFrom ci-dessus est vide —
  # l'objectif declare de networkPolicy.enabled (restreindre l'entree
  # applicative) serait sinon silencieusement inoperant. Positionner ce
  # flag a true desactive ce garde-fou pour les installations qui assument
  # deliberement ce risque (par exemple un cluster mono-tenant de confiance,
  # ou un controleur Ingress dont le namespace/les labels ne peuvent pas
  # etre exprimes via NetworkPolicyPeer). Sans effet si networkPolicy.enabled
  # est false, ou si ingressFrom est deja renseigne.
  allowAllIngressSources: false
