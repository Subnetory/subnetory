<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::#main-content})}">
<body>
<div id="main-content">
<div class="sn-page">

    <div class="sn-page__header">
        <div>
            <h1 class="sn-page__title" th:text="${pageTitle}">Site</h1>
            <p class="sn-page__subtitle" th:text="#{site.form.subtitle}">Rattachez ce site à un contexte pour organiser vos VLAN et sous-réseaux.</p>
        </div>
    </div>

    <div th:if="${formError}" class="sn-alert sn-alert--error" th:text="${formError}"></div>

    <div class="sn-card sn-card--padded sn-form-card">
        <div class="sn-card__header">
            <h2 class="sn-card__title" th:text="${pageTitle}">Site</h2>
        </div>

        <form th:action="${formAction}" th:object="${form}" method="post" novalidate class="sn-form">

            <input type="hidden" th:field="*{id}" />

            <div class="sn-form__group" th:classappend="${#fields.hasErrors('name')} ? ' sn-form__group--error'">
                <label for="name" class="sn-form__label">
                    <span th:text="#{common.name}">Nom</span> <span class="sn-form-required">*</span>
                </label>
                <input type="text"
                       id="name"
                       th:field="*{name}"
                       class="sn-input"
                       th:placeholder="#{site.form.name.placeholder}"
                       autocomplete="off"
                       maxlength="100"
                       required
                       aria-required="true" />
                <span class="sn-form__error"
                      th:if="${#fields.hasErrors('name')}"
                      th:errors="*{name}"></span>
            </div>

            <div class="sn-form__group" th:classappend="${#fields.hasErrors('code')} ? ' sn-form__group--error'">
                <label for="code" class="sn-form__label">
                    <span th:text="#{common.code}">Code</span> <span class="sn-form-required">*</span>
                </label>
                <input type="text"
                       id="code"
                       th:field="*{code}"
                       class="sn-input"
                       th:placeholder="#{site.form.code.placeholder}"
                       autocomplete="off"
                       maxlength="20"
                       required
                       aria-required="true"
                       data-uppercase />
                <span class="sn-form__error"
                      th:if="${#fields.hasErrors('code')}"
                      th:errors="*{code}"></span>
            </div>

            <div class="sn-form__group" th:classappend="${#fields.hasErrors('contextId')} ? ' sn-form__group--error'">
                <label for="contextId" class="sn-form__label">
                    <span th:text="#{common.context}">Contexte</span> <span class="sn-form-required">*</span>
                </label>
                <select id="contextId"
                        th:field="*{contextId}"
                        class="sn-input"
                        required
                        aria-required="true">
                    <option value="" th:text="#{select.placeholder.context}">— Sélectionner un contexte —</option>
                    <option th:each="ctx : ${allContexts}"
                            th:value="${ctx.id}"
                            th:text="${ctx.name}">Contexte</option>
                </select>
                <span class="sn-form__error"
                      th:if="${#fields.hasErrors('contextId')}"
                      th:errors="*{contextId}"></span>
            </div>

            <div class="sn-form__actions">
                <button type="submit" class="sn-btn sn-btn--primary" th:text="#{common.save}">Enregistrer</button>
                <a th:href="${cancelUrl}" class="sn-btn sn-btn--secondary" th:text="#{common.cancel}">Annuler</a>
            </div>

        </form>
    </div>

</div>
</div>
</body>
</html>
