<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changement de mot de passe obligatoire - Subnetory</title>
    <link rel="stylesheet" th:href="@{/assets/css/app.css}">
</head>
<body class="sn-login-body">
<div class="sn-login-card">
    <div class="sn-login-brand">
        <span class="sn-navbar__brand-dot"></span>
        Subnetory
    </div>

    <h1 class="sn-card__title">Changement de mot de passe obligatoire</h1>
    <p class="sn-login-subtitle">
        Le mot de passe temporaire doit etre remplace avant toute utilisation de Subnetory.
    </p>

    <div th:if="${flashError}"
         class="sn-alert sn-alert--error"
         th:text="${flashError}"></div>

    <form th:action="@{/profile/change-password-required}"
          th:object="${form}"
          method="post"
          class="sn-form">

        <input type="hidden"
               th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="sn-form__group">
            <label for="currentPassword" class="sn-form__label">
                Mot de passe temporaire actuel
            </label>
            <input id="currentPassword"
                   type="password"
                   th:field="*{currentPassword}"
                   class="sn-input"
                   autocomplete="current-password"
                   autofocus>
            <div th:if="${#fields.hasErrors('currentPassword')}"
                 th:errors="*{currentPassword}"
                 class="sn-form__error"></div>
        </div>

        <div class="sn-form__group">
            <label for="newPassword" class="sn-form__label">
                Nouveau mot de passe
            </label>
            <input id="newPassword"
                   type="password"
                   th:field="*{newPassword}"
                   class="sn-input"
                   autocomplete="new-password">
            <div th:if="${#fields.hasErrors('newPassword')}"
                 th:errors="*{newPassword}"
                 class="sn-form__error"></div>
            <p class="sn-text-muted">
                Minimum 12 caracteres, avec majuscule, minuscule,
                chiffre et caractere special.
            </p>
        </div>

        <div class="sn-form__group">
            <label for="confirmPassword" class="sn-form__label">
                Confirmer le nouveau mot de passe
            </label>
            <input id="confirmPassword"
                   type="password"
                   th:field="*{confirmPassword}"
                   class="sn-input"
                   autocomplete="new-password">
            <div th:if="${#fields.hasErrors('confirmPassword')}"
                 th:errors="*{confirmPassword}"
                 class="sn-form__error"></div>
        </div>

        <button type="submit"
                class="sn-btn sn-btn--primary sn-login-submit">
            Changer le mot de passe et continuer
        </button>
    </form>

    <form th:action="@{/logout}" method="post" class="sn-logout-form">
        <input type="hidden"
               th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
        <button type="submit"
                class="sn-btn sn-btn--ghost sn-login-submit">
            Se deconnecter
        </button>
    </form>
</div>
</body>
</html>
