apiVersion: v1
kind: Service
metadata:
  name: {{ include "subnetory.fullname" . }}
  labels:
    {{- include "subnetory.labels" . | nindent 4 }}
    app.kubernetes.io/component: application
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "subnetory.application.selectorLabels" . | nindent 4 }}
