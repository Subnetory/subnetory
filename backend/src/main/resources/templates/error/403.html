<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:with="t=#{error403.title}" th:text="${t} + ' — Subnetory'">Accès refusé — Subnetory</title>
    <link rel="stylesheet" th:href="@{/assets/css/app.css}">
</head>
<body>
<nav class="sn-navbar">
    <a th:href="@{/}" class="sn-navbar__brand">
        <span class="sn-navbar__brand-dot"></span>
        Subnetory
    </a>
</nav>
<div class="sn-error-page">
    <div class="sn-error-page__code">403</div>
    <h1 class="sn-error-page__title" th:text="#{error403.title}">Accès refusé</h1>
    <p class="sn-error-page__message" th:text="#{error403.message}">Vous n'avez pas les droits nécessaires pour accéder à cette ressource.</p>
    <a th:href="@{/}" class="sn-btn sn-btn--ghost" th:text="#{error.backToDashboard}">Retour au tableau de bord</a>
</div>
</body>
</html>
