backup.cron.hint=Format: seconds minutes hours day-of-month month day-of-week. The builder above covers common cases (including <strong>Interval</strong> for "every N hours" or "every N days", e.g. every other day) and automatically switches to <strong>Custom</strong> for any expression it doesn't recognize exactly — the text field then remains directly editable. Examples: <code>0 0 2 * * *</code> every day at 2am — <code>0 0 */6 * * *</code> every 6 hours — <code>0 0 2 * * SUN</code> every Sunday at 2am.
