# --- Admin help: audit.html ---
helpAdmin.audit.subtitle=Qui a fait quoi et quand : connexions, sauvegardes, création/suppression de ressources réseau.
helpAdmin.audit.access.title=Accès
helpAdmin.audit.access.body=Menu <em>Administration → Audit</em> (<code>/admin/audit-log</code>), réservé <code>ROLE_ADMIN</code>.
helpAdmin.audit.events.title=Événements tracés
helpAdmin.audit.events.authTitle=Authentification et comptes
helpAdmin.audit.events.authCodes=<code>LOGIN_SUCCESS</code>, <code>LOGIN_FAILURE</code>, <code>LOGIN_LOCKED</code>, <code>PASSWORD_CHANGE</code>, <code>ADMIN_PASSWORD_RESET</code>, <code>TOKEN_REVOKED</code>, <code>TOKENS_INVALIDATED</code>, <code>CONTEXT_ACCESS_DENIED</code>, <code>USER_CREATED</code>, <code>USER_CONTEXTS_UPDATED</code>, <code>MFA_ENABLED</code>, <code>MFA_DISABLED</code>, <code>MFA_RECOVERY_CODES_REGENERATED</code>, <code>MFA_CHALLENGE_FAILED</code>, <code>MFA_DISABLED_BY_ADMIN</code>.
helpAdmin.audit.events.backupTitle=Sauvegardes
helpAdmin.audit.events.backupCodes=<code>BACKUP_TRIGGERED</code>, <code>BACKUP_IMPORTED</code>, <code>BACKUP_RESTORED</code>, <code>BACKUP_DELETED</code>, <code>BACKUP_PURGED</code>, <code>BACKUP_SETTINGS_UPDATED</code> — toutes les actions de <code>/admin/backup</code> qui modifient un état.
helpAdmin.audit.events.networkTitle=Ressources réseau
helpAdmin.audit.events.networkCodes=<code>ADDRESS_CREATED</code>/<code>_DELETED</code>, <code>VLAN_CREATED</code>/<code>_DELETED</code>, <code>CONTEXT_CREATED</code>/<code>_DELETED</code>, <code>SITE_CREATED</code>/<code>_DELETED</code>, <code>SUBNET_CREATED</code>/<code>_DELETED</code>.
helpAdmin.audit.filters.title=Filtres et pagination
helpAdmin.audit.filters.body=Deux critères : recherche utilisateur (sur le nom d'utilisateur et l'utilisateur ciblé) et type d'événement — si un type est sélectionné, il est prioritaire sur la recherche texte. Les événements les plus récents sont affichés en premier, 50 entrées par page.
helpAdmin.audit.export.title=Export CSV
helpAdmin.audit.export.body=<code>/admin/audit-log/export.csv</code>, respecte les filtres actifs. Colonnes exportées : date, type d'événement, utilisateur, utilisateur ciblé, IP, succès, message, user-agent. L'export est protégé contre l'injection CSV (les valeurs commençant par <code>=</code>, <code>+</code>, <code>-</code>, <code>@</code> sont préfixées d'une apostrophe).
helpAdmin.audit.export.warning=Ne pas exposer les exports CSV à des utilisateurs non administrateurs.
helpAdmin.audit.retention.title=Rétention et purge
helpAdmin.audit.retention.body=Une purge automatique planifiée chaque nuit supprime les entrées plus anciennes que la durée de rétention configurée (90 jours par défaut).
helpAdmin.table.property=Propriété
helpAdmin.table.envVar=Variable d'environnement
helpAdmin.table.default=Défaut
helpAdmin.audit.retention.manualPurgeIntro=Une purge manuelle immédiate avant une date donnée reste possible depuis <code>/admin/audit-log</code> (bouton « Purger définitivement ») ou via l'API :
helpAdmin.audit.retention.commandLabel=Purge manuelle
helpAdmin.audit.bestPractices.title=Bonnes pratiques
helpAdmin.audit.bestPractices.item1=Conserver la rétention active en production, l'augmenter si le besoin d'audit l'exige.
helpAdmin.audit.bestPractices.item2=Exporter les journaux avant une purge manuelle ou une opération sensible.
helpAdmin.audit.bestPractices.item3=Surveiller la taille de la table <code>auth_audit_log</code> si l'application est fortement utilisée.

# --- Admin help: sauvegardes.html ---
helpAdmin.backup.subtitle=Deux mécanismes indépendants existent — ne pas les activer ensemble sur la même base.
helpAdmin.backup.engine.title=Moteur intégré (recommandé)
helpAdmin.backup.engine.body1=<code>pg_dump</code>/<code>pg_restore</code> lancés par l'application elle-même, identique en Docker Compose et Kubernetes. Interface : <code>/admin/backup</code>. API REST complète, parité totale avec l'interface, préfixe <code>/api/v1/admin/backup</code>, réservée à <code>ROLE_ADMIN</code> ou <code>ROLE_BACKUP</code> (jeton Bearer requis).
helpAdmin.backup.engine.body2=Toute sauvegarde ou restauration restée « En cours » suite à un arrêt brutal (rebuild, crash) est automatiquement marquée en échec au démarrage suivant — aucune ligne ne reste bloquée indéfiniment.
helpAdmin.backup.engine.actionsTitle=Actions disponibles depuis /admin/backup
helpAdmin.backup.engine.action1=Planification automatique via un configurateur cron visuel (quotidien, hebdomadaire, mensuel, intervalle ou expression personnalisée).
helpAdmin.backup.engine.action2=Déclenchement manuel immédiat, avec titre/commentaire optionnel.
helpAdmin.backup.engine.action3=Téléchargement d'un fichier de sauvegarde, avec empreinte SHA-256 vérifiable.
helpAdmin.backup.engine.action4=Import d'un fichier <code>.dump</code> externe (vérifié via <code>pg_restore --list</code> avant acceptation), restaurable ensuite comme n'importe quelle autre sauvegarde.
helpAdmin.backup.engine.action5=Restauration avec confirmation par saisie exacte du nom de fichier — jamais en un clic — et sauvegarde de sécurité automatique juste avant.
helpAdmin.backup.engine.action6=Suppression fine d'une sauvegarde, ou en cascade avec ses restaurations liées.
helpAdmin.backup.engine.action7=Purge manuelle de l'historique avant une date donnée.
helpAdmin.backup.encryption.title=Chiffrement au repos (optionnel)
helpAdmin.backup.encryption.body1=Activé par défaut pour toute nouvelle installation Docker Compose. AES-256-GCM + HMAC-SHA256, clé dérivée par PBKDF2 à partir d'une passphrase fournie exclusivement via la variable <code>SUBNETORY_BACKUP_ENCRYPTION_KEY</code> — jamais stockée en base, jamais modifiable depuis l'interface.
helpAdmin.backup.encryption.body2=Une fois configurée, toute nouvelle sauvegarde (planifiée, manuelle, ou de sécurité pré-restauration) est chiffrée automatiquement (badge « Chiffré » dans l'historique, champ <code>encrypted</code> dans l'API). Les sauvegardes existantes non chiffrées restent utilisables normalement — le chiffrement ne s'applique jamais rétroactivement.
helpAdmin.backup.encryption.warning=<strong>Ce n'est pas une rotation de clé.</strong> Changer ou perdre la valeur de la clé rend définitivement illisibles toutes les sauvegardes déjà chiffrées avec l'ancienne valeur. Conservez la passphrase en dehors de l'application (gestionnaire de secrets de l'équipe), au même titre que le mot de passe PostgreSQL, et ne la changez jamais une fois des sauvegardes chiffrées produites.
helpAdmin.backup.encryption.docs=Génération et protection du secret (permissions restrictives Windows/Linux), et procédure pour une nouvelle instance qui doit rester capable de lire des sauvegardes chiffrées par une autre instance : voir <code>backend/docs/BACKUP_ENCRYPTION.md</code> et <code>backend/docs/INSTALL_DOCKER_COMPOSE.md</code>.
helpAdmin.backup.api.title=Commandes API
helpAdmin.backup.api.currentConfig=Configuration et état courant
helpAdmin.backup.api.trigger=Déclencher une sauvegarde immédiate
helpAdmin.backup.api.restore=Restaurer (confirmation par nom exact de fichier)
helpAdmin.backup.api.purge=Purger l'historique avant une date
helpAdmin.backup.api.docsLink=Référence complète des endpoints (schémas de requête/réponse) : Swagger UI <code>/swagger-ui.html</code>. Voir aussi
helpAdmin.backup.api.docsLinkText=le guide API
helpAdmin.backup.scripts.title=Scripts PowerShell historiques (mécanisme alternatif)
helpAdmin.backup.scripts.body=Indépendants de l'application, utiles en secours si celle-ci est indisponible. Windows + Docker Desktop uniquement.
helpAdmin.table.script=Script
helpAdmin.table.role=Rôle
helpAdmin.backup.scripts.backup.role=Sauvegarde + rotation (hourly/daily/monthly/quarterly)
helpAdmin.backup.scripts.restore.role=Restauration d'un fichier <code>.sql.gz</code>
helpAdmin.backup.scripts.check.role=Contrôle d'état (âge, taille, intégrité GZip, hash SHA-256)
helpAdmin.backup.scripts.dailyLabel=Sauvegarde daily
helpAdmin.backup.scripts.restoreLabel=Restauration avec sauvegarde de sécurité automatique
helpAdmin.backup.scripts.docs=Détail complet (paramètres, automatisation via le Planificateur de tâches Windows, procédure de restauration d'urgence pas à pas) : <code>backend/docs/BACKUP_STRATEGY.md</code>, <code>backend/docs/RESTORE_OPERATIONS.md</code>, <code>backend/docs/BACKUP_SCHEDULING_WINDOWS.md</code>.
helpAdmin.backup.rules.title=Règles de sécurité pour toute restauration
helpAdmin.backup.rules.item1=Ne jamais restaurer sans avoir vérifié le chemin complet et la date du fichier.
helpAdmin.backup.rules.item2=Ne jamais lancer une restauration production sans sauvegarde de sécurité préalable et fenêtre d'intervention identifiée.
helpAdmin.backup.rules.item3=Après restauration : vérifier le démarrage de l'application, l'authentification, la cohérence des données et l'absence d'erreur dans les journaux.
helpAdmin.backup.rules.item4=Documenter toute restauration (date, environnement, fichier utilisé, résultat) dans un compte rendu d'intervention.

# --- Admin help: deploiement-docker.html ---
helpAdmin.docker.subtitle=Installation autonome avec PostgreSQL inclus, secrets fichiers, et exposition HTTPS optionnelle.
helpAdmin.docker.secrets.title=Générer les secrets
helpAdmin.docker.secrets.body1=Trois secrets sont requis avant le premier démarrage : le secret JWT, le mot de passe administrateur temporaire et le mot de passe PostgreSQL. Un script dédié les génère aléatoirement sans jamais afficher leur valeur, et applique des permissions restrictives (<code>icacls</code> sous Windows, <code>chmod 600</code> sous Linux/macOS).
helpAdmin.docker.secrets.powershellLabel=PowerShell
helpAdmin.docker.secrets.bashLabel=Bash
helpAdmin.docker.secrets.body2=Un quatrième secret, <code>subnetory_backup_encryption_key</code>, active le chiffrement des sauvegardes (activé par défaut, généré automatiquement) :
helpAdmin.docker.secrets.withoutEncryptionLabel=Sans chiffrement des sauvegardes
helpAdmin.docker.secrets.warning=Le script refuse d'écraser un secret existant. L'option <code>-Force</code>/<code>--force</code> est réservée à une rotation volontaire et coordonnée — jamais une commande de réparation générique.
helpAdmin.docker.start.title=Démarrer la stack
helpAdmin.docker.start.fromBackendLabel=Depuis backend/
helpAdmin.docker.start.body=Les migrations Flyway s'appliquent automatiquement au démarrage. PostgreSQL reste strictement interne au réseau Compose, jamais publié sur un port de l'hôte.
helpAdmin.docker.secretsProtection.title=Protection des secrets sur le poste
helpAdmin.docker.secretsProtection.body=Les permissions restrictives du script bloquent l'accès à un autre compte non privilégié sur la même machine — elles ne protègent pas contre un attaquant qui obtiendrait les droits de votre propre compte ou les droits administrateur, ni contre le vol d'un disque éteint sans chiffrement de volume (BitLocker/LUKS).
helpAdmin.docker.secretsProtection.warning=Point d'attention particulier si le dossier du dépôt est synchronisé par un client cloud (OneDrive Known Folder Move notamment) : le dossier <code>secrets/</code>, bien que git-ignoré, partirait alors en clair vers le cloud. Vérifiez qu'aucune synchronisation cloud ne couvre ce dossier.
helpAdmin.docker.https.title=HTTPS clé en main (overlay Caddy, optionnel)
helpAdmin.docker.https.body1=<code>docker-compose.https.yml</code> ajoute un reverse proxy Caddy devant l'application, sans infrastructure externe à gérer (pas de certificat à générer ou installer manuellement).
helpAdmin.table.mode=Mode
helpAdmin.table.usage=Usage
helpAdmin.table.certificate=Certificat
helpAdmin.docker.https.mode.internal=Interne
helpAdmin.docker.https.mode.internal.usage=Réseau d'entreprise, pas de domaine public
helpAdmin.docker.https.mode.internal.cert=Auto-signé (avertissement navigateur normal)
helpAdmin.docker.https.mode.public=Public
helpAdmin.docker.https.mode.public.usage=Domaine résolu vers cet hôte, ports 80/443 accessibles depuis Internet
helpAdmin.docker.https.mode.public.cert=Let's Encrypt automatique, renouvelé sans intervention
helpAdmin.docker.https.copyCaddyfileLabel=Mode interne — copier le Caddyfile
helpAdmin.docker.https.startOverlayLabel=Démarrer avec l'overlay
helpAdmin.docker.https.body2=L'overlay active automatiquement la confiance envers le proxy interne (<code>SUBNETORY_SECURITY_TRUSTED_PROXY</code>) pour que le rate limiting par IP et l'audit d'authentification restent exacts — sans cela, toutes les requêtes seraient comptées comme venant d'une seule IP (le conteneur Caddy).
helpAdmin.docker.https.warning=Le volume <code>caddy_data</code> conserve les certificats entre redémarrages — ne pas le supprimer sans raison en mode public (nouvelles demandes Let's Encrypt, risque de limitation de débit en cas de suppressions répétées).
helpAdmin.docker.docs.title=Documents liés
helpAdmin.docker.docs.body=<code>backend/docs/INSTALL_DOCKER_COMPOSE.md</code>, <code>backend/docs/HTTPS_REVERSE_PROXY.md</code>, <code>backend/docs/DOCKER_COMPOSE_OPERATIONS.md</code>.

# --- Admin help: deploiement-kubernetes.html ---
helpAdmin.k8s.subtitle=Chart Helm mono-réplique, avec PostgreSQL inclus ou externe.
helpAdmin.k8s.scope.title=Périmètre
helpAdmin.k8s.scope.body=Le chart <code>charts/subnetory</code> impose <code>replicaCount: 1</code>. Il ne fournit ni haute disponibilité applicative, ni opérateur PostgreSQL, ni image publique officielle — l'image doit être construite et rendue accessible aux nœuds du cluster.
helpAdmin.k8s.image.title=Fournir l'image
helpAdmin.k8s.image.kindLabel=Cluster kind (build local)
helpAdmin.k8s.image.body=Pour un autre cluster : construire l'image, la publier dans le registre privé autorisé, puis fournir <code>image.repository</code>/<code>image.tag</code> et <code>image.imagePullSecrets</code> dans les valeurs. Ne jamais utiliser un tag flottant comme <code>latest</code>.
helpAdmin.k8s.secrets.title=Secrets Kubernetes
helpAdmin.k8s.secrets.body1=Comme pour Docker Compose, un script dédié crée les Secrets sans jamais afficher leur valeur, et refuse d'écraser un Secret existant :
helpAdmin.k8s.secrets.powershellLabel=PowerShell
helpAdmin.k8s.secrets.body2=Deux objets sont créés : <code>subnetory-runtime-secrets</code> (secret JWT, mot de passe PostgreSQL) et <code>subnetory-bootstrap-secrets</code> (mot de passe administrateur temporaire). Le chart ne génère aucun Secret et n'accepte aucune valeur secrète en clair dans <code>values.yaml</code>.
helpAdmin.k8s.installIncluded.title=Installer avec PostgreSQL inclus
helpAdmin.k8s.installIncluded.commandLabel=Valider puis installer
helpAdmin.k8s.installIncluded.body=Crée un Deployment applicatif (stratégie <code>Recreate</code>), un Service <code>ClusterIP</code>, un StatefulSet PostgreSQL, et un PVC PostgreSQL de 8 Gi par défaut (ajustable via <code>postgresql.persistence</code>).
helpAdmin.k8s.installExternal.title=Installer avec PostgreSQL externe
helpAdmin.k8s.installExternal.body=Le rôle et la base externes doivent déjà exister. La valeur <code>postgres-password</code> du Secret runtime doit correspondre exactement au mot de passe du rôle externe configuré.
helpAdmin.k8s.installExternal.valuesLabel=values non sensibles
helpAdmin.k8s.scheduledBackups.title=Sauvegardes planifiées (optionnel)
helpAdmin.k8s.scheduledBackups.body=Désactivées par défaut, réservées au PostgreSQL inclus (le chart refuse leur activation avec une base externe). CronJobs par palier (hourly/daily/monthly/quarterly), chacun avec sa propre rétention. Une NetworkPolicy dédiée aux pods de sauvegarde refuse les entrées et limite les sorties au PostgreSQL inclus et au DNS du cluster.
helpAdmin.k8s.scheduledBackups.warning=Combiner ces sauvegardes planifiées (<code>backup.enabled</code>) avec le moteur intégré applicatif (<code>backupApp.enabled</code>) sur la même base est explicitement rejeté par le chart au rendu (<code>helm template</code> échoue volontairement).
helpAdmin.k8s.scheduledBackups.validate=Toujours valider le rendu avant activation : <code>helm lint .\charts\subnetory --strict</code>.
helpAdmin.k8s.docs.title=Documents liés
helpAdmin.k8s.docs.body=<code>backend/docs/INSTALL_KUBERNETES.md</code> (procédure complète, y compris rotation et dépannage), <code>backend/docs/KUBERNETES_OPERATIONS.md</code>, <code>backend/docs/KUBERNETES_COMPATIBILITY.md</code>.

# --- User help hub / help.html ---
help.heading=Aide
