spring:
  config:
    import: "optional:configtree:/run/secrets/"

  application:
    name: subnetory

  servlet:
    multipart:
      # Correctif securite M1 : borne la taille des imports CSV/XLSX.
      # Protege contre les uploads massifs et les fichiers XLSX "zip bomb"
      # qui se decompressent en memoire via Apache POI.
      #
      # Plafond releve le 01/08/2026 (200 Mo par defaut) pour couvrir aussi
      # l'import de sauvegardes (.dump, voir POST /admin/backup/import) : ce
      # plafond Spring est la limite dure avant meme d'atteindre le
      # controleur ; subnetory.backup.import-max-size-bytes (defaut 200MB
      # egalement) est la limite specifique appliquee ensuite dans
      # BackupExecutionService, avec un message d'erreur clair plutot qu'une
      # erreur multipart generique.
      max-file-size: ${SUBNETORY_MAX_UPLOAD_FILE_SIZE:200MB}
      max-request-size: ${SUBNETORY_MAX_UPLOAD_REQUEST_SIZE:210MB}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/subnetory?stringtype=unspecified}
    username: ${SPRING_DATASOURCE_USERNAME:subnetory}
    password: ${SPRING_DATASOURCE_PASSWORD:subnetory}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      # Flyway est la source de vérité du schéma. Hibernate ne touche pas
      # au DDL. `validate` poserait problème avec les types PostgreSQL natifs
      # (inet, macaddr) qui n'existent pas dans le mapping SQL standard.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        timezone:
          # Hibernate 6 normalise par défaut les colonnes timestamptz en
          # NORMALIZE_UTC : "hibernate.jdbc.time_zone" est alors totalement
          # ignoré en lecture/écriture, quelle que soit sa valeur (confirmé
          # empiriquement : API JSON renvoyait "...Z" et l'IHM restait
          # décalée de 2h, alors que JVM/Postgres/conteneur étaient tous
          # correctement configurés en Europe/Paris). NORMALIZE (au lieu de
          # NORMALIZE_UTC) est le mode qui respecte réellement jdbc.time_zone.
          default_storage: NORMALIZE
        jdbc:
          # A adapter au pays de déploiement via .env (TZ).
          time_zone: ${TZ:Europe/Paris}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Internationalisation (01/08/2026) : francais (defaut) et anglais.
  # Bascule via ?lang=fr / ?lang=en, memorisee dans un cookie (dev.subnetory.config.I18nConfig).
  # Deploiement progressif : navigation, tableau de bord et CRUD reseau traduits en premier ;
  # administration, aide et messages de validation/erreur suivront dans une prochaine passe
  # (voir backend/docs, section internationalisation).
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    always-use-message-format: false

subnetory:
  admin:
    default-password: ${SUBNETORY_ADMIN_DEFAULT_PASSWORD:}

  auth:
    ldap:
      enabled: ${SUBNETORY_LDAP_ENABLED:false}
      url: ${SUBNETORY_LDAP_URL:ldap://localhost:389}
      base-dn: ${SUBNETORY_LDAP_BASE_DN:dc=example,dc=com}
      user-search-base: ${SUBNETORY_LDAP_USER_SEARCH_BASE:ou=users}
      user-search-filter: ${SUBNETORY_LDAP_USER_SEARCH_FILTER:(sAMAccountName={0})}
      manager-dn: ${SUBNETORY_LDAP_MANAGER_DN:}
      manager-password: ${SUBNETORY_LDAP_MANAGER_PASSWORD:}
      default-role: ${SUBNETORY_LDAP_DEFAULT_ROLE:ROLE_IP}

  audit:
    retention:
      enabled: ${SUBNETORY_AUDIT_RETENTION_ENABLED:true}
      days: ${SUBNETORY_AUDIT_RETENTION_DAYS:90}
      cron: "${SUBNETORY_AUDIT_RETENTION_CRON:0 30 2 * * *}"
  scan:
    timeout-seconds: ${SUBNETORY_SCAN_TIMEOUT:60}
    nmap-path: ${SUBNETORY_SCAN_NMAP_PATH:nmap}
  backup:
    # Sauvegarde de la base (Phase 7 audit, 31/07/2026). Valeurs par defaut
    # tant qu'aucune configuration n'est enregistree via /admin/backup —
    # cf. dev.subnetory.service.BackupConfigurationService.
    enabled: ${SUBNETORY_BACKUP_ENABLED:false}
    cron: "${SUBNETORY_BACKUP_CRON:0 0 2 * * *}"
    retention-count: ${SUBNETORY_BACKUP_RETENTION_COUNT:14}
    # Identique en Docker Compose et en Kubernetes : l'application execute
    # elle-meme pg_dump/pg_restore, sans dependre de l'orchestrateur.
    storage-path: ${SUBNETORY_BACKUP_STORAGE_PATH:/var/subnetory/backups}
    pg-dump-path: ${SUBNETORY_BACKUP_PG_DUMP_PATH:pg_dump}
    pg-restore-path: ${SUBNETORY_BACKUP_PG_RESTORE_PATH:pg_restore}
    timeout-seconds: ${SUBNETORY_BACKUP_TIMEOUT:1800}
    # Import d'un fichier .dump externe (audit 01/08/2026, POST /admin/backup/import).
    # Doit rester <= spring.servlet.multipart.max-file-size ci-dessus.
    import-max-size-bytes: ${SUBNETORY_BACKUP_IMPORT_MAX_SIZE_BYTES:209715200}
    encryption:
      # Chiffrement au repos des fichiers .dump (audit 01/08/2026, backlog #13) :
      # AES-256-GCM + HMAC-SHA256, cle derivee par PBKDF2 a partir de cette
      # valeur. Vide par defaut = chiffrement desactive (comportement actuel
      # inchange). Volontairement jamais stockee en base ni modifiable depuis
      # l'IHM : a fournir via un secret Docker Compose/Kubernetes, jamais en
      # clair dans ce fichier. ATTENTION : changer cette valeur rend
      # illisibles toutes les sauvegardes chiffrees avec l'ancienne cle — ce
      # n'est pas une rotation, voir backend/docs/BACKUP_ENCRYPTION.md.
      key: ${SUBNETORY_BACKUP_ENCRYPTION_KEY:}
    scheduler:
      enabled: ${SUBNETORY_BACKUP_SCHEDULER_ENABLED:true}
  security:
    # Rate limiting generalise sur /api/v1/** (Sprint 2.36 / correctif F7).
    # Complementaire au rate limiting strict de /api/v1/auth/token (H2).
    # Seuil volontairement genereux : ne doit pas gener un usage normal
    # (dashboard, imports en masse). /actuator/health** reste toujours exempte.
    api-rate-limit:
      enabled: ${SUBNETORY_API_RATE_LIMIT_ENABLED:true}
      requests-per-window: ${SUBNETORY_API_RATE_LIMIT_REQUESTS:300}
      window-seconds: ${SUBNETORY_API_RATE_LIMIT_WINDOW_SECONDS:60}
    # Cle de chiffrement dediee (audit 02/08/2026) pour les secrets stockes
    # en base (mot de passe de bind LDAP, secret TOTP MFA), separee du
    # secret JWT. Vide par defaut : SecretCipherService retombe alors sur
    # subnetory.jwt.secret avec un avertissement au demarrage. Recommande en
    # production, meme format que le secret JWT (chaine hexadecimale longue,
    # generee par scripts/init-compose.sh/.ps1).
    encryption-key: ${SUBNETORY_ENCRYPTION_KEY:}
  jwt:
    # Variable obligatoire en production. Minimum recommandé : 32 caractères.
    secret: ${SUBNETORY_JWT_SECRET}
    expiration-minutes: ${SUBNETORY_JWT_EXPIRATION_MINUTES:60}
    revocation:
      purge:
        enabled: ${SUBNETORY_JWT_REVOCATION_PURGE_ENABLED:true}
        cron: "${SUBNETORY_JWT_REVOCATION_PURGE_CRON:0 30 3 * * *}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    # LDAP est un fournisseur d'authentification optionnel, pas une dépendance vitale.
    # Sans cette ligne, spring-security-ldap active un contributor LDAP qui retourne
    # DOWN quand aucun serveur LDAP n'est joignable, ce qui passe /actuator/health en 503.
    ldap:
      enabled: false
  info:
    env:
      enabled: false

logging:
  level:
    dev.subnetory: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

server:
  shutdown: graceful
  port: ${SERVER_PORT:8080}
  # Correctif securite MOYENNE (02/08/2026) : par defaut Spring/Tomcat
  # ignorent X-Forwarded-Proto, donc request.isSecure() renvoie toujours
  # false derriere un reverse proxy qui termine le TLS (overlay
  # docker-compose.https.yml / Caddy, voir HTTPS_REVERSE_PROXY.md). Deux
  # consequences concretes sans ce correctif : le cookie de session
  # n'obtient jamais l'attribut Secure (Tomcat ne l'ajoute que si la
  # requete est vue comme securisee), et les URLs absolues generees par
  # Spring (redirections) restent en http:// meme derriere HTTPS.
  # "none" par defaut : safe pour le mode HTTP direct (docker-compose.yml
  # de base, sans proxy) ou une valeur usurpee de X-Forwarded-Proto n'a
  # aucun sens a etre prise en compte. L'overlay HTTPS positionne
  # explicitement SERVER_FORWARD_HEADERS_STRATEGY=framework, en coherence
  # avec SUBNETORY_SECURITY_TRUSTED_PROXY deja active pour ClientIpResolver
  # dans ce meme overlay (cf. docker-compose.https.yml).
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      cookie:
        # HttpOnly explicite (deja le defaut Spring Boot, mais documente ici
        # par hygiene) : interdit tout acces au cookie de session depuis du
        # JavaScript cote client, meme en cas de XSS.
        http-only: true
        # SameSite=Lax : le cookie de session n'est pas envoye sur des
        # requetes cross-site de navigation type <img>/<script>/fetch
        # depuis un autre site, ce qui attenue le CSRF sur les endpoints
        # sensibles au-dela de la protection CSRF applicative deja active
        # (chaine Web, SecurityConfig). "Lax" (et non "Strict") car le
        # formulaire de login est atteint par navigation classique
        # (redirection depuis un lien externe) qui doit rester fonctionnelle.
        same-site: lax
        # "secure" volontairement non fixe en dur : Tomcat l'ajoute
        # automatiquement des lors que la requete est vue comme securisee
        # (request.isSecure()), ce qui redevient fiable une fois
        # forward-headers-strategy correctement configure ci-dessus. Un
        # "true" fige casserait le mode HTTP direct (docker-compose.yml de
        # base), qui reste un mode de deploiement supporte.
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false

# OpenAPI / Swagger UI — Sprint 2.8
# Accessible sur /swagger-ui.html (redirige vers /swagger-ui/index.html)
# et /v3/api-docs (JSON) / /v3/api-docs.yaml (YAML).
# Les URLs sont en permitAll() dans SecurityConfig (chaîne @Order(2)).
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    # Désactive le validateur externe — évite les appels vers validator.swagger.io
    validator-url: "none"
