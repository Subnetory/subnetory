{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "subnetory.fullname" . }}-application
  labels:
    {{- include "subnetory.labels" . | nindent 4 }}
    app.kubernetes.io/component: application
spec:
  podSelector:
    matchLabels:
      {{- include "subnetory.application.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.application.serverPort }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "subnetory.postgresql.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgresql.service.port }}
    {{- else }}
    {{- range .Values.networkPolicy.externalDatabaseCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.externalDatabase.port }}
    {{- end }}
    {{- end }}
    {{- range .Values.networkPolicy.allowedScanCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
    {{- end }}
---
{{- if .Values.postgresql.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "subnetory.fullname" . }}-postgresql
  labels:
    {{- include "subnetory.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  podSelector:
    matchLabels:
      {{- include "subnetory.postgresql.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "subnetory.application.selectorLabels" . | nindent 14 }}
        {{- if .Values.backup.enabled }}
        - podSelector:
            matchLabels:
              {{- include "subnetory.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: backup
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgresql.service.port }}
  egress: []
{{- end }}
{{- end }}
